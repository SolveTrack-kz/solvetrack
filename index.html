<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SolveTrack — подготовка к олимпиадам по физике</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/contrib/auto-render.min.js" crossorigin="anonymous" onload="window.__katexReady&&window.__katexReady()"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<style>
/* Layout: public dark-navy landing; app shell = icon sidebar + topbar + content; problem page = list | statement | AI panel */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#f0f3f9; --line:#e4e8f0; --fg:#0f1a2e; --muted:#667085;
  --nav:#0e1b38; --nav-fg:#9fb0cf; --navy-1:#0b1220; --navy-2:#1e3a8a; --navy-3:#2563eb;
  --blue:#2563eb; --purple:#9333ea; --orange:#f59e0b; --green:#10b981; --green-d:#0ea371; --red:#e5484d;
  --blue-soft:#e6eeff; --purple-soft:#f1e6fd; --orange-soft:#fff1d6; --green-soft:#d9f7ea; --ai-bg:#e8f0ff;
  --shadow:0 1px 2px rgba(15,26,46,.05),0 4px 14px rgba(15,26,46,.05);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1122; --surface:#111b33; --surface2:#16223f; --line:#22304f; --fg:#e8eefc; --muted:#8fa0c2;
  --nav:#070d1b; --nav-fg:#8fa0c2; --blue-soft:#14295a; --purple-soft:#2a1747; --orange-soft:#3a2a0b; --green-soft:#0c3326; --ai-bg:#15264d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1122; --surface:#111b33; --surface2:#16223f; --line:#22304f; --fg:#e8eefc; --muted:#8fa0c2;
  --nav:#070d1b; --nav-fg:#8fa0c2; --blue-soft:#14295a; --purple-soft:#2a1747; --orange-soft:#3a2a0b; --green-soft:#0c3326; --ai-bg:#15264d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:var(--green-d)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.blue:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.block{width:100%}

/* ---------- landing ---------- */
.land-hero{background:linear-gradient(120deg,#0b1220 0%,#0f2150 45%,#2563eb 130%);color:#fff;padding-block:20px 84px}
.land-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1120px;margin:0 auto 72px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:18px}
.land-nav .links{display:flex;gap:10px;align-items:center}
.land-nav .links a.t{color:#c7d4f2;padding:6px 8px}
.land-nav .links a.t:hover{color:#fff}
.land-hero .inner{max-width:1120px;margin:0 auto}
.land-hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.15;font-weight:700;max-width:16em;letter-spacing:-.01em}
.land-hero p.lead{margin-top:18px;max-width:34em;color:#c7d4f2;font-size:15px}
.land-hero .cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.land-hero .btn.ghost{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.land-body{max-width:1120px;margin:-52px auto 0;padding-bottom:56px}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.scard:hover{transform:translateY(-2px)}
.scard h3{font-size:15px;font-weight:600}
.scard p{color:var(--muted);font-size:13px}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:20px}
.c-blue{background:var(--blue)}.c-purple{background:var(--purple)}.c-orange{background:var(--orange)}.c-green{background:var(--green)}
.feat{margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px 40px}
.feat h3{font-size:16px;font-weight:600;margin-bottom:6px}
.feat p{color:var(--muted)}
.feat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d);font-weight:600;margin-bottom:6px}
.foot{max-width:1120px;margin:0 auto;padding-bottom:36px;color:var(--muted);font-size:12px}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:72px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--nav);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.side .logo-b{width:36px;height:36px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:18px;margin-bottom:14px}
.side a,.side button.nb{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--nav-fg);font-size:18px;border:0;background:none;position:relative}
.side a:hover,.side button.nb:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.on{background:var(--blue);color:#fff}
.side .sp{flex:1}
.side a[data-tip]:hover::after,.side button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:48px;top:50%;transform:translateY(-50%);background:#000;color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:30}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:58px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.search{flex:1;max-width:440px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 33px;font-size:13px}
.top .r{display:flex;align-items:center;gap:14px}
.user{display:flex;align-items:center;gap:10px}
.user .nm{text-align:right;line-height:1.2}
.user .nm b{display:block;font-size:13px;font-weight:600}
.user .nm span{font-size:11px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.content{padding:26px 32px 48px;max-width:1240px;width:100%}
.ph h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--muted);margin-top:4px}
.ph{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 svg{color:var(--blue)}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:6px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.list{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-easy{background:var(--green-soft);color:var(--green-d)}
.p-mid{background:var(--orange-soft);color:#b7791f}
.p-hard{background:#fde4e4;color:var(--red)}
:root[data-theme="dark"] .p-hard{background:#3b1518}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-hard{background:#3b1518}}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-gray{background:var(--surface2);color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--surface2);display:block}
.heat i.l1{background:#a7ecd0}.heat i.l2{background:#5fd6a6}.heat i.l3{background:#10b981}.heat i.l4{background:#0b7a57}
.heatnote{font-size:12px;color:var(--muted);margin-top:8px}

/* catalog */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;min-width:0}
.filters input{flex:1;min-width:180px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.course{overflow:hidden;padding:0;display:flex;flex-direction:column}
.cover{height:150px;position:relative;display:grid;place-items:center;color:#fff}
.cover svg.i{width:54px;height:54px;opacity:.92;stroke-width:1.5}
.cover .lv{position:absolute;right:10px;top:10px;background:var(--blue);color:#fff;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
.course .b{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.course h3{font-size:15px}
.course .by{color:var(--muted);font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12.5px;align-items:center}
.meta b{color:var(--fg)}
.course .btn{margin-top:auto}
.book{display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:center}
.bcover{width:96px;height:128px;border-radius:6px;padding:10px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:12px;line-height:1.25;box-shadow:var(--shadow)}
.bcover small{font-weight:500;opacity:.85;font-size:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.book h3{font-size:15px;display:block}
.book p{color:var(--muted);margin-top:4px;max-width:60ch}
.olym{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center}

/* mentors */
.mentor{display:flex;gap:14px;align-items:flex-start}
.mentor .avatar{width:48px;height:48px;font-size:15px;background:var(--purple)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* roadmap */
.tl{display:flex;flex-direction:column;gap:0;margin-top:6px}
.step{display:grid;grid-template-columns:28px 1fr;gap:14px;padding-bottom:22px;position:relative}
.step:before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step:last-child:before{display:none}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--surface2);color:var(--muted);border:2px solid var(--line)}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.dot.now{background:var(--orange);border-color:var(--orange);color:#fff}
.step h4{font-size:14px;font-weight:600}
.step p{color:var(--muted);font-size:13px}

/* problems table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.lk{cursor:pointer}
.tbl tr.lk:hover td{background:var(--surface2)}
.tw{overflow-x:auto}

/* problem page */
.pg{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;height:calc(100vh - 58px);min-height:560px}
.pg>*{min-width:0;overflow-y:auto}
.plist{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
.plist .back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-bottom:14px}
.plist h3{font-size:14px;margin-bottom:10px;padding-left:6px}
.plist a{display:flex;gap:9px;align-items:center;padding:8px 8px;border-radius:8px;font-size:13px}
.plist a:hover{background:var(--surface2)}
.plist a.on{background:var(--blue-soft);color:var(--blue);font-weight:500}
.plist .st{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.plist .st.ok{background:var(--green);border-color:var(--green)}
.plist .st.try{border-color:var(--orange);background:var(--orange-soft)}
.stmt{padding:18px 20px}
.stmt .card{padding:24px 28px}
.stmt h2{font-size:21px;margin-bottom:12px}
.stmt h3{font-size:16px;margin:22px 0 10px}
.stmt p.t{font-size:14.5px;line-height:1.65}
.stmt ol{padding-left:22px;margin:12px 0;line-height:1.9}
.diagram{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px;background:var(--surface)}
.diagram svg{width:100%;height:auto;display:block}
.cap{color:var(--muted);font-size:12px;margin-top:8px}
.sol textarea{width:100%;min-height:120px;resize:vertical;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px}
.sol .act{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.attempt{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.attempt .q{color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word}
.ai{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:10px}
.ai h3{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--blue)}
.ai .note{font-size:11.5px;color:var(--muted)}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.55;max-width:92%;white-space:pre-wrap;word-break:break-word}
.msg.ai{background:var(--ai-bg);display:block;border-left:0;padding:10px 12px}
.msg .who{font-size:11px;font-weight:700;display:block;margin-bottom:2px;color:var(--blue)}
.msg.typing .who{display:inline;margin-right:6px}
.msg.me{background:var(--surface2);align-self:flex-end}
.ask{display:flex;flex-direction:column;gap:8px}
.ask input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px}
.ask .r{display:flex;justify-content:space-between;gap:8px}

.pf{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.pf .big{width:88px;height:88px;font-size:30px;margin:0 auto 12px}
.pf .who{text-align:center}
.pf .who b{display:block;font-size:17px}
.pf .who span{color:var(--muted);font-size:13px}
.pf .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pf .mini div{background:var(--surface2);border-radius:8px;padding:8px;text-align:center}
.pf .mini b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pf .mini span{font-size:11px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--fg);min-width:0;width:100%}
.form .full{grid-column:1/-1}
.form textarea{min-height:90px;resize:vertical}
.fa{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.danger{color:var(--red)}
@media (max-width:760px){.pf{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
@media (max-width:1100px){
  .pg{grid-template-columns:200px minmax(0,1fr);height:auto}
  .pg>*{overflow:visible}
  .ai{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .chat{max-height:320px}
  .stats{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));z-index:40}
  .side .logo-b,.side .sp,.side [data-tip]::after{display:none!important}
  .side .nb.out{display:none}
  .top{padding:0 max(14px,env(safe-area-inset-left,0px))}
  .user .nm{display:none}
  .content{padding:18px max(16px,env(safe-area-inset-left,0px)) 36px}
  .g2{grid-template-columns:1fr}
  .pg{grid-template-columns:1fr}
  .plist{border-right:0;border-bottom:1px solid var(--line)}
  .book{grid-template-columns:72px 1fr}
  .book .bcover{width:72px;height:98px;font-size:10px;padding:7px}
  .book .btn{grid-column:1/-1}
  .olym{grid-template-columns:40px 1fr}
  .olym .btn{grid-column:1/-1}
  .land-nav{margin-bottom:44px}
  .stmt{padding:12px}.stmt .card{padding:18px}
}
@media (max-width:420px){.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* language switcher */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--surface2)}
.seg button.on{background:var(--blue);color:#fff}
.land-nav .seg,.auth-top .seg{border-color:rgba(255,255,255,.25)}
.land-nav .seg button,.auth-top .seg button{background:transparent;color:#c7d4f2;padding:5px 9px;font-size:12px}
.land-nav .seg button+button,.auth-top .seg button+button{border-left-color:rgba(255,255,255,.25)}
.land-nav .seg button:hover,.auth-top .seg button:hover{color:#fff;background:rgba(255,255,255,.08)}
.land-nav .seg button.on,.auth-top .seg button.on{background:rgba(255,255,255,.2);color:#fff}
@media (max-width:560px){.land-nav .links a.t{display:none}}

/* AI chat states */
.msg.err{background:#fde4e4;color:#9b1c1f;border:1px solid #f5b5b7}
:root[data-theme="dark"] .msg.err{background:#3b1518;color:#ffb4b6;border-color:#5c2326}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.err{background:#3b1518;color:#ffb4b6;border-color:#5c2326}}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:rgba(0,0,0,.06);padding:0 4px;border-radius:4px}
.typing{color:var(--muted)}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--blue);display:block;animation:blink 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
.ask input:disabled,.ask button:disabled{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12px;align-self:flex-start;text-decoration:underline}
.linkbtn:hover{color:var(--fg)}

/* auth */
.auth{min-height:100vh;background:linear-gradient(120deg,#0b1220 0%,#0f2150 45%,#2563eb 130%);padding:20px max(16px,env(safe-area-inset-left,0px)) 48px;display:flex;flex-direction:column;align-items:center}
.auth-top{width:100%;max-width:1120px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;margin-bottom:48px}
.auth-card{width:100%;max-width:460px;padding:28px}
.auth-card h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.auth-form{margin-top:18px}
.ferr{background:#fde4e4;color:#9b1c1f;border-radius:8px;padding:9px 12px;font-size:13px}
.auth-alt{text-align:center;margin-top:16px;font-size:13.5px}
.auth-alt a{color:var(--blue);font-weight:600}
/* entry test */
.dx{max-width:760px}
.dx-prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.dx .bar{margin-bottom:22px}.dx .bar i{background:var(--blue);transition:width .2s}
.dx-label{font-size:12.5px;color:var(--muted);font-weight:600;margin:20px 0 8px}
.dx-text{font-size:15.5px;line-height:1.6}
.dx-rules{margin:14px 0 0;padding-left:20px;line-height:1.75;color:var(--muted)}
.stmt-q{margin:0;padding:14px 18px;border-left:4px solid var(--blue);background:var(--surface2);border-radius:0 10px 10px 0;font-size:16.5px;line-height:1.55}
.stmt-q.sm{font-size:14px;padding:10px 14px;margin-top:8px}
.choices{display:grid;gap:10px}
.stmt-q+.choices{margin-top:14px}
.choices.two{grid-template-columns:1fr 1fr}.choices.three{grid-template-columns:repeat(3,1fr)}.choices.four{grid-template-columns:1fr 1fr}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-weight:500;font-size:14px;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--blue)}
.choice.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.choice.idk{border-style:dashed;color:var(--muted)}
.choice.idk.on{border-style:solid;color:var(--blue)}
.choice.wide{width:100%;margin-top:10px}
.dx-nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.res-item{border-top:1px solid var(--line);padding:14px 0}
.res-item:first-of-type{border-top:0}
.res-item .hd2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:14px}
.res-item p{color:var(--muted);font-size:13px;margin-top:6px}
.res-item p.expl{color:var(--fg);font-size:13.5px;line-height:1.6}
.banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;border-color:var(--blue);background:var(--blue-soft)}
/* roadmap */
.g2.rm{grid-template-columns:2fr 1fr;align-items:start}
.lvl-v{font-size:24px;font-weight:700;margin:2px 0 8px}
.lvl-bar{display:flex;gap:4px;margin-bottom:10px}
.lvl-bar i{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.lvl-bar i.on{background:var(--blue)}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.dot.todo{background:var(--surface);border-color:var(--blue)}
details.mis{border-top:1px solid var(--line);padding:12px 0}
details.mis:first-of-type{border-top:0}
details.mis>summary{cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center;list-style:none}
details.mis>summary::-webkit-details-marker{display:none}
details.mis>summary:before{content:"▸";color:var(--muted);width:10px}
details.mis[open]>summary:before{content:"▾"}
.mis-b{padding:12px 0 4px 18px}
details.expl{margin-top:12px}
details.expl>summary{color:var(--blue);font-size:13px;cursor:pointer}
details.expl p{font-size:13.5px;line-height:1.6;margin-top:6px}
.linkbtn.blue{color:var(--blue);text-decoration:none;font-size:13px}
.plan-wait{display:flex;align-items:center;gap:8px;margin-top:8px}
@media (max-width:760px){.g2.rm{grid-template-columns:1fr}.choices.three,.choices.four{grid-template-columns:1fr}.mis-b{padding-left:0}}

/* formulas (KaTeX) */
.katex{font-size:1.07em}
.msg .katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}
.stmt-q .katex,.dx-text .katex{font-size:1.04em}

/* entry test — focused, friendly layout */
.dx-wrap{max-width:720px;margin:8px auto 0}
.dx-card{padding:26px 28px;border-radius:18px;animation:dxIn .32s ease}
.dx-card[data-noanim]{animation:none}
@keyframes dxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dx-intro{text-align:center;padding:36px 32px 26px}
.dx-badge{width:64px;height:64px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;color:#fff;font-size:30px;background:linear-gradient(135deg,#2563eb,#9333ea);box-shadow:0 10px 24px rgba(37,99,235,.28)}
.dx-intro h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.dx-lead{color:var(--muted);margin:10px auto 0;max-width:52ch;font-size:14.5px;line-height:1.6}
.dx-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0 6px}
.dx-meta div{display:flex;align-items:center;gap:7px;background:var(--surface2);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted)}
.dx-meta svg{color:var(--blue)}.dx-meta b{color:var(--fg);font-weight:600}
.dx-how{text-align:left;background:var(--surface2);border-radius:14px;padding:16px 18px;margin-top:18px}
.dx-how-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:10px}
.dx-how-row{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.dx-how-row .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.dx-how-row p{font-size:13.5px;line-height:1.55}
.mini-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini-chips span{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}
.mini-chips span.ghost{border-style:dashed;color:var(--muted)}
.dx-intro-act{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn.big{padding:12px 26px;font-size:15px;border-radius:12px}
.dx-keys{margin-top:14px;font-size:12px;color:var(--muted)}
.dx-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dx-chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.dx-type{font-size:12px;color:var(--muted);font-weight:500}
.dx-count{margin-left:auto;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.dx-segs{display:flex;gap:4px;margin:12px 0 22px}
.dx-segs i{flex:1;height:5px;border-radius:99px;background:var(--surface2);transition:background .2s}
.dx-segs i.done{background:var(--blue)}
.dx-segs i.cur{background:var(--blue);opacity:.45}
.dx-q-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.dx-statement{font-size:19px;line-height:1.5;font-weight:500;padding:20px 22px;border-radius:14px;background:linear-gradient(135deg,var(--blue-soft),var(--purple-soft));margin-bottom:16px}
.dx-problem{font-size:16.5px;line-height:1.6;margin-bottom:16px}
.tiles{display:grid;gap:10px}
.tiles.three{grid-template-columns:repeat(3,1fr)}.tiles.two{grid-template-columns:1fr 1fr}
.tile{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;min-height:56px;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;font-weight:600;font-size:14.5px;transition:border-color .15s,background .15s,transform .08s,box-shadow .15s}
.tile:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(37,99,235,.10)}
.tile:active{transform:scale(.98)}
.tile .ti{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface2);font-size:15px}
.tile.ok .ti{color:var(--green-d);background:var(--green-soft)}
.tile.no .ti{color:var(--red);background:#fde4e4}
.tile.idk{border-style:dashed;color:var(--muted)}
.tile.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);border-style:solid;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.tile.ok.on{border-color:var(--green);background:var(--green-soft);color:var(--green-d);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.tile.no.on{border-color:var(--red);background:#fde4e4;color:var(--red);box-shadow:0 0 0 3px rgba(229,72,77,.12)}
.tile .em{font-size:20px;line-height:1}
.tile.opt{justify-content:flex-start}
.tile .letter{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);font-size:12.5px;font-weight:700;color:var(--muted)}
.tile.on .letter{background:var(--blue);color:#fff}
.tile.wide{width:100%;margin-top:10px;font-weight:500;font-size:13.5px}
.tile kbd{position:absolute;top:6px;right:8px;font:600 10px/1 var(--font);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px;opacity:.7}
.dx-conf{margin-top:20px;animation:dxIn .22s ease}
.tiles.conf .tile{flex-direction:column;gap:4px;min-height:76px;font-size:13.5px}
.dx-card .dx-nav{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.btn.ghostbtn{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghostbtn:hover{background:var(--surface2);color:var(--fg)}
.dx-calc{text-align:center;padding:54px 24px}
.dx-calc h2{font-size:17px;font-weight:600;margin-top:16px}
.dx-spin{width:44px;height:44px;margin:0 auto;border-radius:50%;border:4px solid var(--blue-soft);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stat.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);border-color:transparent;color:#fff}
.stat.hero .l,.stat.hero .s{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .tile.no .ti,:root[data-theme="dark"] .tile.no.on{background:#3b1518}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile.no .ti,:root:not([data-theme="light"]) .tile.no.on{background:#3b1518}}
@media (max-width:600px){
  .dx-card{padding:20px 18px}.dx-intro{padding:28px 18px 20px}
  .dx-statement{font-size:17px;padding:16px}
  .tiles.three,.tiles.two{grid-template-columns:1fr}
  .tiles.conf{grid-template-columns:repeat(3,1fr)}
  .tiles.conf .tile{min-height:70px;font-size:12px;padding:10px 6px}
  .tile kbd{display:none}
}
@media (hover:none){.tile kbd,.dx-keys{display:none}}
@media (prefers-reduced-motion:reduce){.dx-card,.dx-conf{animation:none}.dx-spin{animation-duration:2s}}

/* more problems links */
.card.more{margin-top:16px}
.more-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.more-links a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.more-links a:hover{border-color:var(--blue)}
.more-links b{color:var(--blue)}
.more-links span{font-size:12.5px;color:var(--muted)}

/* phone: don't push the statement below a 36-item list */
@media (max-width:760px){.plist h3,.plist a:not(.back):not(.on){display:none}.plist{padding:12px 16px}.plist a.on{margin-top:4px}}

/* placement exam, rating, contests */
.px-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.px-lv{font-size:12.5px;color:var(--muted)}
.px-timer{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:15px;color:var(--fg)}
.px-timer .i{width:16px;height:16px}
.px-timer.low{color:var(--red)}
.px-segs{display:flex;gap:5px;margin-bottom:18px}
.px-segs i{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.px-segs i.ok{background:var(--green)}.px-segs i.no{background:var(--red)}.px-segs i.cur{background:var(--blue)}
.px-msg{border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:6px}
.px-msg.ok{background:var(--green-soft,#dcfce7);color:#166534}.px-msg.no{background:#fde4e4;color:#9b1c1f}
.px-in{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.px-in div{display:flex;align-items:center;gap:10px;margin-top:6px}
.px-in input{width:180px;max-width:60%;font-size:18px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--fg);font-variant-numeric:tabular-nums}
.px-in input:focus{outline:none;border-color:var(--blue)}
.px-in em{font-style:normal;font-size:15px;color:var(--fg);font-weight:500}
.px-form{margin-top:18px}
.rt-big{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.rt-big>span{font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rt-big div{display:flex;flex-direction:column}.rt-big small{color:var(--muted);font-size:12.5px}
.c-bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:64px;z-index:5;margin-bottom:16px;padding:12px 18px;font-weight:600}
.content>.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-bottom:10px}
.card.olym>.btn{flex:none;align-self:center}

/* solution scans */
.scan{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.scan img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.scan label.btn{cursor:pointer}
.scan-res{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:10px;border-radius:10px;background:var(--surface2)}
.scan-res img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);flex:none}
.scan-res b{font-size:13px}.scan-res p{color:var(--fg);font-size:13.5px;line-height:1.55;margin-top:4px}

/* cloud auth */
.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.boot .mark{width:48px;height:48px;border-radius:12px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.boot .mark .i{width:26px;height:26px}
.fok{background:#dcfce7;color:#166534;border-radius:8px;padding:9px 12px;font-size:13px}
.mail-ico{width:52px;height:52px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.mail-ico .i{width:26px;height:26px}
.seg.sm button{padding:4px 10px;font-size:12px}
.tbl tr.me td{background:var(--blue-soft)}
.btn.busy{opacity:.6;pointer-events:none}

/* Google sign-in */
.g-btn{margin-top:18px;justify-content:center;gap:10px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--surface);border:1.5px solid var(--line)}
.g-btn:hover{border-color:var(--blue)}
.or{display:flex;align-items:center;gap:12px;margin:18px 0 4px;color:var(--muted);font-size:12.5px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}

/* round avatars never squeeze */
.avatar{flex:none;aspect-ratio:1/1;min-width:0}
.mentor .avatar{flex:0 0 48px}

/* streaming answer */
.st-txt{white-space:pre-wrap}
.caret{display:inline-block;width:7px;height:14px;margin-left:2px;vertical-align:-2px;background:var(--blue);animation:blink 1s infinite}

/* sidebar: labels slide out on hover (desktop only) — clip-path reveal, no layout work per frame */
.side .lbl{display:none}
@media (min-width:761px){
  .shell>.main{grid-column:2}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:236px;z-index:60;align-items:flex-start;padding:14px 16px;overflow:hidden;
    clip-path:inset(0 164px 0 0);transition:clip-path .26s cubic-bezier(.22,.8,.24,1) .05s;will-change:clip-path}
  .side a,.side button.nb{width:204px;flex:none;display:flex;align-items:center;justify-content:flex-start;gap:14px;padding:0 11px;white-space:nowrap;text-align:left;background:none!important;isolation:isolate}
  .side a::before,.side button.nb::before{content:'';position:absolute;inset:0;border-radius:10px;background:transparent;z-index:-1;
    clip-path:inset(0 164px 0 0 round 10px);transition:clip-path .26s cubic-bezier(.22,.8,.24,1) .05s,background-color .15s}
  .side a:hover::before,.side button.nb:hover::before{background:rgba(255,255,255,.08)}
  .side a.on::before{background:var(--blue)}
  .side .logo-b{width:204px;height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 2px;margin-bottom:14px;background:none;white-space:nowrap}
  .side .logo-b .i{flex:none;width:36px;height:36px;padding:8px;box-sizing:border-box;background:var(--blue);border-radius:10px}
  .side a .i,.side button.nb .i{flex:none}
  .side .lbl{display:inline;font-size:14px;font-weight:500;opacity:0;transition:opacity .14s linear}
  .side .logo-b .lbl{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .side [data-tip]::after{display:none!important}
  .side:hover,.side:has(:focus-visible){clip-path:inset(0 0 0 0)}
  .side:hover .lbl,.side:has(:focus-visible) .lbl{opacity:1;transition:opacity .2s linear .06s}
  .side:hover a::before,.side:hover button.nb::before,.side:has(:focus-visible) a::before,.side:has(:focus-visible) button.nb::before{clip-path:inset(0 0 0 0 round 10px)}
}
@media (prefers-reduced-motion:reduce){.side,.side a::before,.side button.nb::before{transition:none!important}}

/* roadmap: game-like path */
.rm-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-bottom:18px;padding:24px 28px;background:linear-gradient(135deg,var(--surface) 0%,var(--blue-soft) 140%)}
.ring-w{position:relative;width:132px;height:132px}
.ring{width:132px;height:132px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-v b{font-size:28px;font-weight:800;letter-spacing:-.02em}
.ring-v span{font-size:12px;color:var(--muted);margin-top:2px}
.rh-m .kicker{margin-bottom:4px}
.rh-m h2{margin:0 0 6px;font-size:22px;line-height:1.25;letter-spacing:-.01em}
.rh-m p{margin:0 0 14px;color:var(--muted);font-size:14px;max-width:62ch}
.btn.lg{padding:11px 20px;font-size:15px;border-radius:12px}
.rh-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip .i{width:14px;height:14px}
