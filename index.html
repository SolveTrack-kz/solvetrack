var PROBLEMS=[
{id:1,tp:0,lvl:1,keys:['врем|уақыт|time','весь путь|всего пути|общ|бүкіл жол|жалпы|барлық жол|total|whole|entire','14[,.]4'],
ru:['Средняя скорость велосипедиста','Велосипедист проехал первую половину пути со скоростью 12 км/ч, а вторую половину со скоростью 18 км/ч.',['Почему средняя скорость не равна 15 км/ч?','Найдите среднюю скорость на всём пути.'],['Средняя скорость равна всему пути, делённому на всё время, а не среднему арифметическому скоростей.','Обозначьте весь путь за $2S$. Выразите время на каждой половине через $S$.','Сложите времена и разделите $2S$ на сумму. $S$ сократится.']],
kk:['Велосипедшінің орташа жылдамдығы','Велосипедші жолдың бірінші жартысын 12 км/сағ жылдамдықпен, ал екінші жартысын 18 км/сағ жылдамдықпен жүріп өтті.',['Неліктен орташа жылдамдық 15 км/сағ-қа тең емес?','Бүкіл жолдағы орташа жылдамдықты табыңыз.'],['Орташа жылдамдық жылдамдықтардың арифметикалық ортасына емес, бүкіл жолды бүкіл уақытқа бөлгенге тең.','Бүкіл жолды $2S$ деп белгілеңіз. Әр жартыдағы уақытты $S$ арқылы өрнектеңіз.','Уақыттарды қосып, $2S$-ті олардың қосындысына бөліңіз. $S$ қысқарады.']],
en:['Cyclist’s average speed','A cyclist covered the first half of the distance at 12 km/h and the second half at 18 km/h.',['Why is the average speed not 15 km/h?','Find the average speed over the whole trip.'],['Average speed is total distance divided by total time, not the arithmetic mean of the speeds.','Let the whole distance be $2S$. Express the time for each half in terms of $S$.','Add the times and divide $2S$ by the sum. $S$ cancels out.']]},
{id:2,tp:0,lvl:2,keys:['скорост|жылдамд|speed|velocit','длин|путь|ұзынд|length|distance','72|1[,.]2'],
ru:['Эскалатор в метро','Эскалатор поднимает неподвижно стоящего на нём пассажира за 2 мин. Пассажир, идущий по неподвижному эскалатору, поднимается за 3 мин.',['За какое время поднимется пассажир, который идёт по движущемуся эскалатору?'],['Длину эскалатора обозначьте $L$. Выразите скорость эскалатора и скорость пассажира через $L$.','Скорости складываются: идущий по движущемуся эскалатору имеет скорость $v_1 + v_2$.','Время равно $L$, делённому на сумму скоростей. $L$ сократится.']],
kk:['Метродағы эскалатор','Эскалатор онда қозғалмай тұрған жолаушыны 2 минутта көтереді. Қозғалмайтын эскалатормен жүріп бара жатқан жолаушы 3 минутта көтеріледі.',['Қозғалып тұрған эскалатормен жүріп бара жатқан жолаушы қанша уақытта көтеріледі?'],['Эскалатордың ұзындығын $L$ деп белгілеңіз. Эскалатордың және жолаушының жылдамдығын $L$ арқылы өрнектеңіз.','Жылдамдықтар қосылады: қозғалып тұрған эскалатормен жүрген жолаушының жылдамдығы $v_1 + v_2$.','Уақыт $L$-ді жылдамдықтардың қосындысына бөлгенге тең. $L$ қысқарады.']],
en:['Metro escalator','An escalator lifts a passenger standing still on it in 2 min. A passenger walking up the stopped escalator takes 3 min.',['How long will it take a passenger walking up the moving escalator?'],['Let the escalator length be $L$. Express the escalator’s speed and the passenger’s speed in terms of $L$.','The speeds add up: a passenger walking on a moving escalator has speed $v_1 + v_2$.','The time is $L$ divided by the sum of the speeds. $L$ cancels out.']]},
{id:3,tp:1,lvl:1,keys:['объ[её]м|көлем|volume','плотност|тығызд|densit|ρ|\\\\rho','0[,.]8|800'],
ru:['Банка и неизвестная жидкость','Пустая банка имеет массу 300 г. Заполненная водой, она имеет массу 800 г, а заполненная неизвестной жидкостью 700 г. Плотность воды 1 г/см³.',['Найдите объём банки.','Найдите плотность неизвестной жидкости.'],['Найдите массу воды в банке и по плотности воды вычислите объём.','Объём жидкости такой же, как объём воды: она заполняет ту же банку.','Плотность равна массе жидкости, делённой на объём.']],
kk:['Құты және белгісіз сұйықтық','Бос құтының массасы 300 г. Сумен толтырылғанда оның массасы 800 г, ал белгісіз сұйықтықпен толтырылғанда 700 г. Судың тығыздығы 1 г/см³.',['Құтының көлемін табыңыз.','Белгісіз сұйықтықтың тығыздығын табыңыз.'],['Құтыдағы судың массасын тауып, судың тығыздығы арқылы көлемін есептеңіз.','Сұйықтықтың көлемі судың көлеміне тең: ол сол құтыны толтырады.','Тығыздық сұйықтықтың массасын көлемге бөлгенге тең.']],
en:['Jar and unknown liquid','An empty jar has a mass of 300 g. Filled with water, its mass is 800 g; filled with an unknown liquid, 700 g. The density of water is 1 g/cm³.',['Find the volume of the jar.','Find the density of the unknown liquid.'],['Find the mass of the water in the jar and use the density of water to compute the volume.','The liquid’s volume equals the water’s volume: it fills the same jar.','Density equals the liquid’s mass divided by the volume.']]},
{id:4,tp:1,lvl:2,keys:['давлен|қысым|pressure','площад|аудан|area','вес|тяжест|салмақ|ауырлық|weight|gravit','1000'],
ru:['Кирпич на столе','Кирпич массой 3 кг имеет размеры $25 \\times 12 \\times 6$ см. Он лежит на горизонтальном столе. Примите $g = 10$ Н/кг.',['Чему равно наименьшее давление кирпича на стол?','Чему равно наибольшее давление?','Во сколько раз они различаются?'],['Давление равно силе, делённой на площадь опоры. Сила здесь — вес кирпича.','Наименьшее давление получится на грани с наибольшей площадью, наибольшее на самой маленькой грани.','Переведите площади в м² и аккуратно посчитайте. Отношение давлений равно обратному отношению площадей.']],
kk:['Үстелдегі кірпіш','Массасы 3 кг кірпіштің өлшемдері $25 \\times 12 \\times 6$ см. Ол көлденең үстелде жатыр. $g = 10$ Н/кг деп алыңыз.',['Кірпіштің үстелге түсіретін ең аз қысымы неге тең?','Ең үлкен қысымы неге тең?','Олар бір-бірінен неше есе ерекшеленеді?'],['Қысым күшті тірек ауданына бөлгенге тең. Мұндағы күш — кірпіштің салмағы.','Ең аз қысым ауданы ең үлкен жақта, ең үлкен қысым ең кіші жақта болады.','Аудандарды м²-ге айналдырып, мұқият есептеңіз. Қысымдардың қатынасы аудандардың кері қатынасына тең.']],
en:['Brick on a table','A 3 kg brick measures $25 \\times 12 \\times 6$ cm. It lies on a horizontal table. Take $g = 10$ N/kg.',['What is the smallest pressure the brick exerts on the table?','What is the largest pressure?','By what factor do they differ?'],['Pressure is force divided by contact area. Here the force is the brick’s weight.','The smallest pressure is on the face with the largest area, the largest on the smallest face.','Convert the areas to m² and calculate carefully. The ratio of the pressures is the inverse ratio of the areas.']]},
{id:5,tp:1,lvl:2,keys:['архимед|выталкив|archimed|buoyan','равновес|уравновеш|плаван|тепе-тең|теңест|жүз|balanc|equilibr|float','600|0[,.]6','400|0[,.]4'],
ru:['Кубик в воде','Деревянный кубик с ребром 10 см плавает в воде, погрузившись на 6 см. Плотность воды 1000 кг/м³, $g = 10$ Н/кг.',['Найдите плотность дерева.','Какой груз нужно положить сверху, чтобы кубик погрузился полностью?'],['Кубик плавает: сила Архимеда равна силе тяжести.','Сила Архимеда зависит от объёма погружённой части. Запишите оба выражения через ребро кубика.','Во втором случае вся сила Архимеда уравновешивает вес кубика и груза вместе.']],
kk:['Судағы текше','Қыры 10 см ағаш текше суда 6 см батып жүзіп жүр. Судың тығыздығы 1000 кг/м³, $g = 10$ Н/кг.',['Ағаштың тығыздығын табыңыз.','Текше толық бату үшін оның үстіне қандай жүк қою керек?'],['Текше жүзіп жүр: Архимед күші ауырлық күшіне тең.','Архимед күші батқан бөліктің көлеміне байланысты. Екі өрнекті де текшенің қыры арқылы жазыңыз.','Екінші жағдайда бүкіл Архимед күші текше мен жүктің жалпы салмағын теңестіреді.']],
en:['Cube in water','A wooden cube with 10 cm edges floats in water, submerged to a depth of 6 cm. The density of water is 1000 kg/m³, $g = 10$ N/kg.',['Find the density of the wood.','What load must be placed on top for the cube to be fully submerged?'],['The cube floats: the buoyant force equals the force of gravity.','The buoyant force depends on the volume of the submerged part. Write both expressions in terms of the cube’s edge.','In the second case, the full buoyant force balances the combined weight of the cube and the load.']]},
{id:6,tp:2,lvl:2,keys:['баланс|отдал|получил|берді|алды|тепе-тең|balance|lost|gain|give|receiv','удельн|c·m|cm|меншікті|specific','35','18 ?900|18,9'],
ru:['Смешивание воды','Смешали 300 г воды при 20 °C и 100 г воды при 80 °C. Потерями тепла пренебрегите. Удельная теплоёмкость воды 4200 Дж/(кг·°C).',['Найдите температуру смеси.','Сколько тепла отдала горячая вода?'],['Горячая вода отдаёт столько тепла, сколько получает холодная.','Запишите $Q = cm(t_2 - t_1)$ для каждой части. Конечную температуру обозначьте t.','Подставьте найденное t в формулу для горячей воды.']],
kk:['Суды араластыру','20 °C-тағы 300 г су мен 80 °C-тағы 100 г суды араластырды. Жылу шығынын ескермеңіз. Судың меншікті жылу сыйымдылығы 4200 Дж/(кг·°C).',['Қоспаның температурасын табыңыз.','Ыстық су қанша жылу берді?'],['Ыстық су суық су қанша жылу алса, сонша жылу береді.','Әр бөлік үшін $Q = cm(t_2 - t_1)$ жазыңыз. Соңғы температураны t деп белгілеңіз.','Табылған t мәнін ыстық суға арналған формулаға қойыңыз.']],
en:['Mixing water','300 g of water at 20 °C is mixed with 100 g of water at 80 °C. Neglect heat losses. The specific heat capacity of water is 4200 J/(kg·°C).',['Find the temperature of the mixture.','How much heat did the hot water give off?'],['The hot water gives off as much heat as the cold water receives.','Write $Q = cm(t_2 - t_1)$ for each part. Call the final temperature t.','Substitute the t you found into the formula for the hot water.']]},
{id:7,tp:0,lvl:3,keys:['без проскальз|сырғанаусыз|without slip|no slip|rolling','мгновенн|касани|неподвиж|жанасу|қозғалмай|instant|contact|at rest','2v|2·v|вдвое|в два раза|екі есе|twice|double','2πr|2π|длин[а-я]* обода|длин[а-я]* окружн|шеңбер|circumference'],
ru:['Кольцо на наклонной плоскости','Тонкое кольцо радиусом $R$ скатывается без проскальзывания по наклонной плоскости с углом $\\theta = 30^\\circ$. В некоторый момент скорость центра кольца равна $v = 0{,}6$ м/с.',['Чему равна скорость точки кольца, которая касается плоскости?','Чему равна скорость самой верхней точки относительно плоскости?','На какое расстояние сместится центр кольца за один полный оборот?'],['Без проскальзывания значит: точка касания в этот момент неподвижна относительно плоскости.','Движение кольца — это поступательное движение центра со скоростью $v$ плюс вращение вокруг центра с линейной скоростью $v$ на ободе.','Для верхней точки обе скорости направлены одинаково. За один оборот центр проходит путь, равный длине обода.']],
kk:['Көлбеу жазықтықтағы сақина','$R$ радиусты жұқа сақина $\\theta = 30^\\circ$ бұрышы бар көлбеу жазықтықпен сырғанаусыз домалап түседі. Бір мезетте сақина центрінің жылдамдығы $v = 0{,}6$ м/с.',['Сақинаның жазықтықпен жанасатын нүктесінің жылдамдығы неге тең?','Ең жоғарғы нүктенің жазықтыққа қатысты жылдамдығы неге тең?','Бір толық айналымда сақинаның центрі қандай қашықтыққа жылжиды?'],['Сырғанаусыз дегеніміз: жанасу нүктесі осы мезетте жазықтыққа қатысты қозғалмайды.','Сақинаның қозғалысы — центрдің $v$ жылдамдықпен ілгерілемелі қозғалысы мен шеңбер бойындағы сызықтық жылдамдығы $v$ болатын центрді айнала айналудың қосындысы.','Жоғарғы нүкте үшін екі жылдамдық бірдей бағытталған. Бір айналымда центр шеңбердің ұзындығына тең жол жүреді.']],
en:['Ring on an incline','A thin ring of radius $R$ rolls without slipping down an inclined plane at angle $\\theta = 30^\\circ$. At some moment the speed of the ring’s center is $v = 0.6$ m/s.',['What is the speed of the point of the ring that touches the plane?','What is the speed of the topmost point relative to the plane?','How far does the ring’s center move during one full revolution?'],['Without slipping means the contact point is at rest relative to the plane at that instant.','The ring’s motion is translation of the center at speed $v$ plus rotation about the center with linear speed $v$ at the rim.','For the top point both velocities point the same way. In one revolution the center travels a distance equal to the circumference.']]},
{id:8,tp:2,lvl:3,keys:['плавлен|балқу|ери|fusion|melt|λ|\\\\lambda','33 ?000|33 ?600','весь|полностью|растает|толық|бәрі|all of|completely|entire|fully','0[,.]3'],
ru:['Лёд в калориметре','В калориметр с 400 г воды при 20 °C бросили кусок льда массой 100 г при 0 °C. Теплоёмкостью калориметра пренебрегите. Удельная теплота плавления льда 330 кДж/кг, теплоёмкость воды 4200 Дж/(кг·°C).',['Растает ли весь лёд?','Какая температура установится в калориметре?'],['Сравните два числа: сколько тепла нужно, чтобы расплавить весь лёд, и сколько выделится при остывании воды до 0 °C.','Если тепла хватает, лёд растает полностью, и останется лишнее тепло.','Лишнее тепло нагревает всю воду, включая воду от растаявшего льда.']],
kk:['Калориметрдегі мұз','20 °C-тағы 400 г суы бар калориметрге 0 °C-тағы массасы 100 г мұз кесегін салды. Калориметрдің жылу сыйымдылығын ескермеңіз. Мұздың меншікті балқу жылуы 330 кДж/кг, судың жылу сыйымдылығы 4200 Дж/(кг·°C).',['Мұздың бәрі еріп кете ме?','Калориметрде қандай температура орнайды?'],['Екі санды салыстырыңыз: бүкіл мұзды ерітуге қанша жылу керек және су 0 °C-қа дейін суығанда қанша жылу бөлінеді.','Жылу жетсе, мұз толық ериді және артық жылу қалады.','Артық жылу барлық суды, соның ішінде ерген мұздан пайда болған суды да жылытады.']],
en:['Ice in a calorimeter','A 100 g piece of ice at 0 °C is dropped into a calorimeter holding 400 g of water at 20 °C. Neglect the heat capacity of the calorimeter. The specific heat of fusion of ice is 330 kJ/kg; the specific heat capacity of water is 4200 J/(kg·°C).',['Will all the ice melt?','What temperature will be established in the calorimeter?'],['Compare two numbers: the heat needed to melt all the ice and the heat released as the water cools to 0 °C.','If there is enough heat, the ice melts completely and some heat is left over.','The leftover heat warms all the water, including the water from the melted ice.']]},
{id:9,tp:3,lvl:2,keys:['параллель|parallel','последовательн|тізбектей|series','ома|u ?/ ?r|ом заң|ohm','0[,.]67|2/3'],
ru:['Смешанное соединение резисторов','Резисторы 6 Ом и 3 Ом соединены параллельно, и к ним последовательно подключён резистор 4 Ом. Напряжение на всей цепи 12 В.',['Найдите общее сопротивление цепи.','Найдите ток в неразветвлённой части.','Найдите ток через резистор 6 Ом.'],['Сначала найдите сопротивление параллельного участка: $\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}$.','Потом сложите его с последовательным резистором и примените закон Ома ко всей цепи.','Напряжение на параллельном участке найдите как $I \\cdot R_{\\text{пар}}$, затем разделите на 6 Ом.']],
kk:['Резисторлардың аралас қосылуы','6 Ом және 3 Ом резисторлар параллель қосылған, оларға 4 Ом резистор тізбектей жалғанған. Бүкіл тізбектегі кернеу 12 В.',['Тізбектің жалпы кедергісін табыңыз.','Тармақталмаған бөліктегі ток күшін табыңыз.','6 Ом резистор арқылы өтетін ток күшін табыңыз.'],['Алдымен параллель бөліктің кедергісін табыңыз: $\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}$.','Содан кейін оны тізбектей жалғанған резистормен қосып, бүкіл тізбекке Ом заңын қолданыңыз.','Параллель бөліктегі кернеуді $I \\cdot R_{\\text{пар}}$ ретінде тауып, 6 Ом-ға бөліңіз.']],
en:['Mixed resistor circuit','Resistors of 6 Ω and 3 Ω are connected in parallel, and a 4 Ω resistor is connected in series with them. The voltage across the whole circuit is 12 V.',['Find the total resistance of the circuit.','Find the current in the unbranched part.','Find the current through the 6 Ω resistor.'],['First find the resistance of the parallel section: $\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}$.','Then add the series resistor and apply Ohm’s law to the whole circuit.','Find the voltage across the parallel section as $I \\cdot R_{\\text{par}}$, then divide by 6 Ω.']]},
{id:10,tp:0,lvl:2,keys:["независим|перпендикуляр|тәуелсіз|independen|perpendicular", "(^|[^0-9])24", "72", "5[,.]8|√ ?34|\\\\sqrt\\{?34|sqrt"],
ru:["Переправа через реку", "Лодка переплывает реку шириной $d = 120$ м. Скорость лодки относительно воды $v = 5$ м/с и всё время направлена перпендикулярно берегу, скорость течения $u = 3$ м/с.", ["Сколько времени займёт переправа?", "На какое расстояние лодку снесёт вниз по течению?", "Чему равна скорость лодки относительно берега?"], ["Движение поперёк реки и снос течением происходят независимо друг от друга.", "Время переправы зависит только от поперечной скорости: $t = \\dfrac{d}{v}$. За это же время течение сносит лодку на $s = u t$.", "Скорость относительно берега — векторная сумма $\\vec v + \\vec u$; векторы перпендикулярны, поэтому работает теорема Пифагора."]],
kk:["Өзеннен өту", "Қайық ені $d = 120$ м өзеннен өтеді. Қайықтың суға қатысты жылдамдығы $v = 5$ м/с және үнемі жағаға перпендикуляр бағытталған, ағыс жылдамдығы $u = 3$ м/с.", ["Өту қанша уақыт алады?", "Қайықты ағыс бойымен қанша қашықтыққа ағызып әкетеді?", "Қайықтың жағаға қатысты жылдамдығы неге тең?"], ["Өзенді көлденең кесіп өту мен ағыспен ығысу бір-біріне тәуелсіз жүреді.", "Өту уақыты тек көлденең жылдамдыққа тәуелді: $t = \\dfrac{d}{v}$. Осы уақытта ағыс қайықты $s = u t$ қашықтыққа ығыстырады.", "Жағаға қатысты жылдамдық — $\\vec v + \\vec u$ векторлық қосындысы; векторлар перпендикуляр, сондықтан Пифагор теоремасы қолданылады."]],
en:["Crossing a river", "A boat crosses a river $d = 120$ m wide. Its speed relative to the water is $v = 5$ m/s and always points perpendicular to the bank; the current speed is $u = 3$ m/s.", ["How long does the crossing take?", "How far downstream is the boat carried?", "What is the boat’s speed relative to the bank?"], ["Motion across the river and drift with the current happen independently.", "The crossing time depends only on the perpendicular speed: $t = \\dfrac{d}{v}$. During this time the current carries the boat $s = u t$.", "The speed relative to the bank is the vector sum $\\vec v + \\vec u$; the vectors are perpendicular, so use the Pythagorean theorem."]]},
{id:11,tp:4,lvl:1,keys:["трени|үйкеліс|friction", "ньютон|newton|ma\\b|m ?a ?=", "(^|[^0-9])6 ?Н|(^|[^0-9])6 ?N|F_?\\{?тр\\}? ?= ?6|= ?6 ?Н", "a ?= ?2|(^|[^0-9])2 ?м/с|(^|[^0-9])2 ?m/s"],
ru:["Брусок тянут по столу", "Брусок массой $m = 2$ кг тянут по горизонтальному столу горизонтальной силой $F = 10$ Н. Коэффициент трения $\\mu = 0{,}3$, $g = 10$ м/с².", ["Чему равна сила трения скольжения?", "С каким ускорением движется брусок?"], ["Сила трения скольжения: $F_{\\text{тр}} = \\mu N$, а на горизонтальном столе $N = mg$.", "Запиши второй закон Ньютона для горизонтального направления: $ma = F - F_{\\text{тр}}$.", "Проверь, что $F > F_{\\text{тр}}$: иначе брусок вообще не сдвинется."]],
kk:["Үстелде сүйретілген кесек", "Массасы $m = 2$ кг кесекті көлденең үстелде $F = 10$ Н көлденең күшпен сүйрейді. Үйкеліс коэффициенті $\\mu = 0{,}3$, $g = 10$ м/с².", ["Сырғанау үйкеліс күші неге тең?", "Кесек қандай үдеумен қозғалады?"], ["Сырғанау үйкеліс күші: $F_{\\text{үйк}} = \\mu N$, ал көлденең үстелде $N = mg$.", "Көлденең бағыт үшін Ньютонның екінші заңын жаз: $ma = F - F_{\\text{үйк}}$.", "$F > F_{\\text{үйк}}$ екенін тексер: әйтпесе кесек мүлде қозғалмайды."]],
en:["Pulling a block across a table", "A block of mass $m = 2$ kg is pulled across a horizontal table by a horizontal force $F = 10$ N. The coefficient of friction is $\\mu = 0.3$, $g = 10$ m/s².", ["What is the kinetic friction force?", "What is the block’s acceleration?"], ["Kinetic friction: $F_{\\text{fr}} = \\mu N$, and on a horizontal table $N = mg$.", "Write Newton’s second law along the horizontal: $ma = F - F_{\\text{fr}}$.", "Check that $F > F_{\\text{fr}}$; otherwise the block won’t move at all."]]},
{id:12,tp:4,lvl:2,keys:["проекц|проекция|ось|оське|project|axis", "sin|cos", "3[,.]2[67]|3[,.]3", "0[,.]5[78]|tg|tan"],
ru:["Брусок на наклонной плоскости", "Брусок соскальзывает с наклонной плоскости с углом наклона $\\alpha = 30^\\circ$. Коэффициент трения $\\mu = 0{,}2$, $g = 10$ м/с².", ["С каким ускорением скользит брусок?", "При каком коэффициенте трения брусок скользил бы равномерно?"], ["Направь ось $x$ вдоль плоскости вниз, ось $y$ — перпендикулярно ей, и разложи силу тяжести на проекции.", "Вдоль $y$ ускорения нет, поэтому $N = mg\\cos\\alpha$. Вдоль $x$: $ma = mg\\sin\\alpha - \\mu N$.", "Равномерное движение означает $a = 0$: тогда $\\mu = \\operatorname{tg}\\alpha$."]],
kk:["Көлбеу жазықтықтағы кесек", "Кесек көлбеулік бұрышы $\\alpha = 30^\\circ$ жазықтықпен сырғанап түседі. Үйкеліс коэффициенті $\\mu = 0{,}2$, $g = 10$ м/с².", ["Кесек қандай үдеумен сырғанайды?", "Үйкеліс коэффициенті қандай болғанда кесек бірқалыпты сырғанар еді?"], ["$x$ осін жазықтық бойымен төмен, $y$ осін оған перпендикуляр бағытта, ауырлық күшін проекцияларға жікте.", "$y$ бойымен үдеу жоқ, сондықтан $N = mg\\cos\\alpha$. $x$ бойымен: $ma = mg\\sin\\alpha - \\mu N$.", "Бірқалыпты қозғалыс $a = 0$ дегенді білдіреді: онда $\\mu = \\operatorname{tg}\\alpha$."]],
en:["Block on an incline", "A block slides down a plane inclined at $\\alpha = 30^\\circ$. The coefficient of friction is $\\mu = 0.2$, $g = 10$ m/s².", ["What is the block’s acceleration?", "For what coefficient of friction would the block slide at constant speed?"], ["Point the $x$ axis down along the plane and the $y$ axis perpendicular to it; resolve gravity into components.", "There is no acceleration along $y$, so $N = mg\\cos\\alpha$. Along $x$: $ma = mg\\sin\\alpha - \\mu N$.", "Constant speed means $a = 0$, so $\\mu = \\tan\\alpha$."]]},
{id:13,tp:4,lvl:3,keys:["натяжен|керілу|tension", "для каждого|каждого груза|әр жүк|each (body|mass|load)|систем|жүйе|system", "a ?= ?2|(^|[^0-9])2 ?м/с|(^|[^0-9])2 ?m/s", "24"],
ru:["Два груза на блоке", "Через неподвижный невесомый блок перекинута лёгкая нерастяжимая нить, к концам которой привязаны грузы массами $m_1 = 3$ кг и $m_2 = 2$ кг. Трения нет, $g = 10$ м/с².", ["С каким ускорением движутся грузы?", "Чему равна сила натяжения нити?"], ["Нить нерастяжима, поэтому ускорения грузов равны по модулю, а натяжение одинаково по всей нити.", "Запиши второй закон Ньютона отдельно для каждого груза: $m_1 a = m_1 g - T$ и $m_2 a = T - m_2 g$.", "Сложи уравнения — $T$ сократится, и найдётся $a$. Затем подставь $a$ в любое уравнение."]],
kk:["Блоктағы екі жүк", "Қозғалмайтын салмақсыз блок арқылы жеңіл созылмайтын жіп асылған, оның ұштарына массалары $m_1 = 3$ кг және $m_2 = 2$ кг жүктер байланған. Үйкеліс жоқ, $g = 10$ м/с².", ["Жүктер қандай үдеумен қозғалады?", "Жіптің керілу күші неге тең?"], ["Жіп созылмайды, сондықтан жүктердің үдеулерінің модульдері тең, ал керілу күші жіптің бойында бірдей.", "Ньютонның екінші заңын әр жүк үшін бөлек жаз: $m_1 a = m_1 g - T$ және $m_2 a = T - m_2 g$.", "Теңдеулерді қос — $T$ қысқарып, $a$ табылады. Содан кейін $a$-ны кез келген теңдеуге қой."]],
en:["Two masses over a pulley", "A light inextensible string passes over a fixed massless pulley; masses $m_1 = 3$ kg and $m_2 = 2$ kg hang from its ends. There is no friction, $g = 10$ m/s².", ["What is the acceleration of the masses?", "What is the tension in the string?"], ["The string doesn’t stretch, so both masses have the same acceleration magnitude, and the tension is the same along the string.", "Write Newton’s second law for each mass separately: $m_1 a = m_1 g - T$ and $m_2 a = T - m_2 g$.", "Add the equations — $T$ cancels and you get $a$. Then substitute $a$ into either equation."]]},
{id:14,tp:5,lvl:1,keys:["импульс|momentum", "сохранен|сақтал|conserv", "v ?= ?2|(^|[^0-9])2 ?м/с|(^|[^0-9])2 ?m/s", "(^|[^0-9])3 ?Дж|(^|[^0-9])3 ?J"],
ru:["Тележки сцепляются", "Тележка массой $m_1 = 2$ кг, едущая со скоростью $v = 3$ м/с, налетает на неподвижную тележку массой $m_2 = 1$ кг, и они сцепляются.", ["С какой скоростью тележки едут после сцепки?", "Сколько механической энергии превратилось в тепло?"], ["При ударе внешние силы по горизонтали не действуют — сохраняется импульс системы.", "$m_1 v = (m_1 + m_2)\\,u$. Энергия при неупругом ударе не сохраняется!", "Потерянная энергия — разность кинетических энергий до и после: $\\Delta E = \\dfrac{m_1 v^2}{2} - \\dfrac{(m_1+m_2)u^2}{2}$."]],
kk:["Арбалар тіркеседі", "$v = 3$ м/с жылдамдықпен келе жатқан массасы $m_1 = 2$ кг арба қозғалмай тұрған массасы $m_2 = 1$ кг арбаға соғылып, олар тіркесіп қалады.", ["Тіркескеннен кейін арбалар қандай жылдамдықпен жүреді?", "Қанша механикалық энергия жылуға айналды?"], ["Соқтығысу кезінде көлденең бағытта сыртқы күштер әсер етпейді — жүйенің импульсі сақталады.", "$m_1 v = (m_1 + m_2)\\,u$. Серпімсіз соқтығысуда энергия сақталмайды!", "Жоғалған энергия — соқтығысуға дейінгі және кейінгі кинетикалық энергиялардың айырмасы: $\\Delta E = \\dfrac{m_1 v^2}{2} - \\dfrac{(m_1+m_2)u^2}{2}$."]],
en:["Carts couple together", "A cart of mass $m_1 = 2$ kg moving at $v = 3$ m/s hits a stationary cart of mass $m_2 = 1$ kg, and they couple together.", ["How fast do the carts move after coupling?", "How much mechanical energy turned into heat?"], ["No horizontal external forces act during the collision, so the system’s momentum is conserved.", "$m_1 v = (m_1 + m_2)\\,u$. Energy is not conserved in an inelastic collision!", "The energy lost is the difference in kinetic energy before and after: $\\Delta E = \\dfrac{m_1 v^2}{2} - \\dfrac{(m_1+m_2)u^2}{2}$."]]},
{id:15,tp:5,lvl:2,keys:["энерги|energy", "mgh|потенц|кинет|kinetic|potential", "v ?= ?6|(^|[^0-9])6 ?м/с|(^|[^0-9])6 ?m/s", "s ?= ?9|(^|[^0-9])9 ?м|(^|[^0-9])9 ?m"],
ru:["Шайба с горки", "Шайба без начальной скорости соскальзывает с гладкой горки высотой $h = 1{,}8$ м, а затем въезжает на горизонтальный участок с коэффициентом трения $\\mu = 0{,}2$. $g = 10$ м/с².", ["С какой скоростью шайба окажется у подножия горки?", "Какой путь она пройдёт по горизонтальному участку до остановки?"], ["На гладкой горке механическая энергия сохраняется: $mgh = \\dfrac{mv^2}{2}$. Форма горки не важна!", "Масса сократится: $v = \\sqrt{2gh}$.", "На горизонтальном участке вся кинетическая энергия уходит на работу силы трения: $\\dfrac{mv^2}{2} = \\mu m g s$."]],
kk:["Төбеден сырғанаған шайба", "Шайба бастапқы жылдамдықсыз биіктігі $h = 1{,}8$ м тегіс төбеден сырғанап түсіп, үйкеліс коэффициенті $\\mu = 0{,}2$ көлденең бөлікке шығады. $g = 10$ м/с².", ["Шайба төбенің етегінде қандай жылдамдықпен болады?", "Тоқтағанға дейін көлденең бөлікте қандай жол жүреді?"], ["Тегіс төбеде механикалық энергия сақталады: $mgh = \\dfrac{mv^2}{2}$. Төбенің пішіні маңызды емес!", "Масса қысқарады: $v = \\sqrt{2gh}$.", "Көлденең бөлікте бүкіл кинетикалық энергия үйкеліс күшінің жұмысына жұмсалады: $\\dfrac{mv^2}{2} = \\mu m g s$."]],
en:["Puck down a slope", "A puck starts from rest and slides down a frictionless slope of height $h = 1.8$ m, then onto a horizontal section with coefficient of friction $\\mu = 0.2$. $g = 10$ m/s².", ["How fast is the puck at the bottom of the slope?", "How far does it slide on the horizontal section before stopping?"], ["On a frictionless slope mechanical energy is conserved: $mgh = \\dfrac{mv^2}{2}$. The slope’s shape doesn’t matter!", "The mass cancels: $v = \\sqrt{2gh}$.", "On the horizontal section all the kinetic energy goes into the work of friction: $\\dfrac{mv^2}{2} = \\mu m g s$."]]},
{id:16,tp:5,lvl:3,keys:["импульс|momentum", "энерги|energy", "неупруг|серпімсіз|inelastic", "101|(^|[^0-9])100 ?м/с|(^|[^0-9])100 ?m/s"],
ru:["Баллистический маятник", "Пуля массой $m = 10$ г попадает в деревянный брусок массой $M = 1$ кг, подвешенный на длинной нити, и застревает в нём. После удара брусок с пулей поднимается на высоту $h = 5$ см. $g = 10$ м/с².", ["С какой скоростью брусок начал двигаться сразу после удара?", "Какой была скорость пули?", "Почему нельзя приравнять кинетическую энергию пули к энергии бруска на высоте $h$?"], ["Раздели процесс на два этапа: короткий удар и подъём бруска.", "Подъём: сохраняется энергия, $\\dfrac{(M+m)V^2}{2} = (M+m)gh$. Удар: сохраняется импульс, $mv = (M+m)V$.", "Удар неупругий — пуля застревает, и большая часть энергии переходит в тепло. Поэтому энергию через удар «протаскивать» нельзя."]],
kk:["Баллистикалық маятник", "Массасы $m = 10$ г оқ ұзын жіпке ілінген массасы $M = 1$ кг ағаш кесекке тиіп, оның ішінде қалады. Соққыдан кейін оғы бар кесек $h = 5$ см биіктікке көтеріледі. $g = 10$ м/с².", ["Соққыдан кейін бірден кесек қандай жылдамдықпен қозғала бастады?", "Оқтың жылдамдығы қандай болды?", "Неліктен оқтың кинетикалық энергиясын кесектің $h$ биіктіктегі энергиясына теңестіруге болмайды?"], ["Процесті екі кезеңге бөл: қысқа соққы және кесектің көтерілуі.", "Көтерілу: энергия сақталады, $\\dfrac{(M+m)V^2}{2} = (M+m)gh$. Соққы: импульс сақталады, $mv = (M+m)V$.", "Соққы серпімсіз — оқ кесекте қалады, энергияның көп бөлігі жылуға айналады. Сондықтан энергияны соққы арқылы «өткізуге» болмайды."]],
en:["Ballistic pendulum", "A bullet of mass $m = 10$ g hits a wooden block of mass $M = 1$ kg hanging on a long string and gets stuck in it. After the impact the block with the bullet rises to a height $h = 5$ cm. $g = 10$ m/s².", ["How fast did the block move right after the impact?", "What was the bullet’s speed?", "Why can’t you equate the bullet’s kinetic energy to the block’s energy at height $h$?"], ["Split the process into two stages: the short impact and the block rising.", "Rising: energy is conserved, $\\dfrac{(M+m)V^2}{2} = (M+m)gh$. Impact: momentum is conserved, $mv = (M+m)V$.", "The impact is inelastic — the bullet sticks, and most of the energy turns into heat. So energy can’t be carried “through” the impact."]]},
{id:17,tp:6,lvl:1,keys:["момент|moment|torque|рычаг|иін|lever", "плеч|иін|arm", "(^|[^0-9])20 ?Н|(^|[^0-9])20 ?N|F ?= ?20"],
ru:["Рычаг", "На лёгком рычаге на расстоянии $l_1 = 20$ см от опоры висит груз массой $m = 6$ кг. $g = 10$ м/с².", ["Какую вертикальную силу нужно приложить с другой стороны на расстоянии $l_2 = 60$ см от опоры, чтобы рычаг был в равновесии?"], ["Рычаг в равновесии, если моменты сил относительно опоры уравновешены.", "Момент силы — это сила, умноженная на плечо: $M = F l$.", "$mg\\,l_1 = F\\,l_2$. Не забудь перевести сантиметры — или просто заметь, что важно только отношение плеч."]],
kk:["Иінтірек", "Жеңіл иінтіректе тіректен $l_1 = 20$ см қашықтықта массасы $m = 6$ кг жүк ілулі тұр. $g = 10$ м/с².", ["Иінтірек тепе-теңдікте болуы үшін екінші жағынан тіректен $l_2 = 60$ см қашықтықта қандай тік күш түсіру керек?"], ["Тірекке қатысты күш моменттері теңгерілсе, иінтірек тепе-теңдікте болады.", "Күш моменті — күшті иінге көбейткенге тең: $M = F l$.", "$mg\\,l_1 = F\\,l_2$. Сантиметрді аударуды ұмытпа — немесе тек иіндердің қатынасы маңызды екенін байқа."]],
en:["Lever", "A load of mass $m = 6$ kg hangs on a light lever at a distance $l_1 = 20$ cm from the pivot. $g = 10$ m/s².", ["What vertical force must be applied on the other side, $l_2 = 60$ cm from the pivot, to keep the lever balanced?"], ["A lever is balanced when the torques about the pivot cancel.", "Torque is force times lever arm: $M = F l$.", "$mg\\,l_1 = F\\,l_2$. Mind the units — or notice that only the ratio of the arms matters."]]},
{id:18,tp:6,lvl:3,keys:["момент|moment|torque", "равновес|тепе-тең|equilibr", "0[,.]2[89]|√ ?3 ?/ ?6|1 ?/ ?\\(?2 ?√ ?3|\\\\frac\\{?1\\}?\\{?2 ?\\\\sqrt", "28[,.][89]|(^|[^0-9])29 ?Н|(^|[^0-9])29 ?N"],
ru:["Лестница у гладкой стены", "Однородная лестница массой $m = 10$ кг стоит на полу и опирается верхним концом на гладкую вертикальную стену. Лестница образует с полом угол $\\alpha = 60^\\circ$. $g = 10$ м/с².", ["С какой силой лестница давит на стену?", "При каком наименьшем коэффициенте трения о пол лестница не соскользнёт?"], ["Стена гладкая — её сила реакции горизонтальна. Пол действует силой нормальной реакции $N$ и силой трения $F_{\\text{тр}}$.", "Сумма сил равна нулю: $N = mg$, $F_{\\text{тр}} = N_{\\text{ст}}$. Сумма моментов относительно нижнего конца тоже равна нулю.", "Моменты относительно нижнего конца: $N_{\\text{ст}}\\,L\\sin\\alpha = mg\\,\\dfrac{L}{2}\\cos\\alpha$. Условие: $F_{\\text{тр}} \\le \\mu N$."]],
kk:["Тегіс қабырғаға сүйенген баспалдақ", "Массасы $m = 10$ кг біртекті баспалдақ еденде тұрып, жоғарғы ұшымен тегіс тік қабырғаға сүйенеді. Баспалдақ еденмен $\\alpha = 60^\\circ$ бұрыш жасайды. $g = 10$ м/с².", ["Баспалдақ қабырғаны қандай күшпен қысады?", "Еденмен үйкеліс коэффициенті ең кемі қандай болғанда баспалдақ сырғанап кетпейді?"], ["Қабырға тегіс — оның реакция күші көлденең. Еден $N$ нормаль реакция күшімен және $F_{\\text{үйк}}$ үйкеліс күшімен әсер етеді.", "Күштердің қосындысы нөлге тең: $N = mg$, $F_{\\text{үйк}} = N_{\\text{қаб}}$. Төменгі ұшқа қатысты моменттердің қосындысы да нөлге тең.", "Төменгі ұшқа қатысты моменттер: $N_{\\text{қаб}}\\,L\\sin\\alpha = mg\\,\\dfrac{L}{2}\\cos\\alpha$. Шарт: $F_{\\text{үйк}} \\le \\mu N$."]],
en:["Ladder against a smooth wall", "A uniform ladder of mass $m = 10$ kg stands on the floor and leans its top end against a smooth vertical wall. The ladder makes an angle $\\alpha = 60^\\circ$ with the floor. $g = 10$ m/s².", ["With what force does the ladder press on the wall?", "What is the smallest coefficient of friction with the floor that keeps the ladder from slipping?"], ["The wall is smooth, so its reaction force is horizontal. The floor exerts a normal force $N$ and a friction force $F_{\\text{fr}}$.", "The forces sum to zero: $N = mg$, $F_{\\text{fr}} = N_{\\text{wall}}$. The torques about the bottom end also sum to zero.", "Torques about the bottom end: $N_{\\text{wall}}\\,L\\sin\\alpha = mg\\,\\dfrac{L}{2}\\cos\\alpha$. Condition: $F_{\\text{fr}} \\le \\mu N$."]]},
{id:19,tp:7,lvl:1,keys:["2 ?π|2 ?\\\\pi|2pi|период|период|period", "3[,.]1|π ?с|\\\\pi ?с|(^|[^0-9a-z])π(\\$| |$)|pi", "не измен|не завис|өзгермейді|тәуелсіз|тәуелді емес|does not|doesn|independent|unchanged|same"],
ru:["Математический маятник", "Грузик подвешен на лёгкой нити длиной $L = 2{,}5$ м. Примите $g = 10$ м/с² и $\\pi^2 \\approx 10$.", ["Чему равен период малых колебаний маятника?", "Как изменится период, если массу грузика увеличить вдвое?"], ["Для малых колебаний период математического маятника $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$.", "$\\sqrt{2{,}5 / 10} = 0{,}5$ с — осталось умножить на $2\\pi$.", "Посмотри на формулу: есть ли в ней масса? Это как с падением тел — масса сокращается."]],
kk:["Математикалық маятник", "Жүк ұзындығы $L = 2{,}5$ м жеңіл жіпке ілінген. $g = 10$ м/с² және $\\pi^2 \\approx 10$ деп алыңыз.", ["Маятниктің кіші тербелістерінің периоды неге тең?", "Жүктің массасын екі есе арттырса, период қалай өзгереді?"], ["Кіші тербелістер үшін математикалық маятниктің периоды $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$.", "$\\sqrt{2{,}5 / 10} = 0{,}5$ с — енді $2\\pi$-ге көбейту қалды.", "Формулаға қара: онда масса бар ма? Денелердің құлауы сияқты — масса қысқарады."]],
en:["Simple pendulum", "A small weight hangs on a light string of length $L = 2.5$ m. Take $g = 10$ m/s² and $\\pi^2 \\approx 10$.", ["What is the period of small oscillations?", "How does the period change if the mass of the weight is doubled?"], ["For small oscillations the period of a simple pendulum is $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$.", "$\\sqrt{2.5 / 10} = 0.5$ s — now multiply by $2\\pi$.", "Look at the formula: does it contain the mass? Like with falling bodies, the mass cancels."]]},
{id:20,tp:7,lvl:2,keys:["жёстк|жестк|қатаң|stiff|spring", "0[,.]31|0[,.]1 ?π|0[,.]1 ?\\\\pi|π ?/ ?10|\\\\pi ?/ ?10", "ω|омега|omega|\\\\omega|20 ?рад|20 ?rad", "0[,.]8"],
ru:["Груз на пружине", "Груз массой $m = 0{,}5$ кг колеблется на пружине жёсткостью $k = 200$ Н/м с амплитудой $A = 4$ см.", ["Чему равен период колебаний?", "Какова наибольшая скорость груза?"], ["Период пружинного маятника $T = 2\\pi\\sqrt{\\dfrac{m}{k}}$.", "Циклическая частота $\\omega = \\sqrt{\\dfrac{k}{m}}$, а при гармонических колебаниях $v_{\\max} = \\omega A$.", "Можно проверить себя через энергию: $\\dfrac{kA^2}{2} = \\dfrac{m v_{\\max}^2}{2}$."]],
kk:["Серіппедегі жүк", "Массасы $m = 0{,}5$ кг жүк қатаңдығы $k = 200$ Н/м серіппеде $A = 4$ см амплитудамен тербеледі.", ["Тербеліс периоды неге тең?", "Жүктің ең үлкен жылдамдығы қандай?"], ["Серіппелі маятниктің периоды $T = 2\\pi\\sqrt{\\dfrac{m}{k}}$.", "Циклдік жиілік $\\omega = \\sqrt{\\dfrac{k}{m}}$, ал гармоникалық тербелісте $v_{\\max} = \\omega A$.", "Өзіңді энергия арқылы тексеруге болады: $\\dfrac{kA^2}{2} = \\dfrac{m v_{\\max}^2}{2}$."]],
en:["Mass on a spring", "A mass $m = 0.5$ kg oscillates on a spring of stiffness $k = 200$ N/m with amplitude $A = 4$ cm.", ["What is the period of oscillation?", "What is the maximum speed of the mass?"], ["The period of a spring pendulum is $T = 2\\pi\\sqrt{\\dfrac{m}{k}}$.", "The angular frequency is $\\omega = \\sqrt{\\dfrac{k}{m}}$, and for harmonic motion $v_{\\max} = \\omega A$.", "Check yourself with energy: $\\dfrac{kA^2}{2} = \\dfrac{m v_{\\max}^2}{2}$."]]},
{id:21,tp:8,lvl:2,keys:["кельвин|kelvin|300 ?К|300 ?K|400", "изохор|isochor|V ?= ?const|тұрақты көлем|постоянн[а-я]* объ|constant volume|шарля|charles|gay", "2[,.]67|2[,.]7|267"],
ru:["Нагретый баллон", "Газ в закрытом баллоне находится при температуре $t_1 = 27\\ ^\\circ$C и давлении $p_1 = 2 \\cdot 10^5$ Па. Баллон нагрели до $t_2 = 127\\ ^\\circ$C.", ["Каким стало давление газа?", "Почему нельзя просто разделить 127 на 27?"], ["Объём баллона не меняется — это изохорный процесс: $\\dfrac{p}{T} = \\text{const}$.", "В газовых законах температура — абсолютная: $T = t + 273$.", "$p_2 = p_1 \\dfrac{T_2}{T_1}$. Отношение температур в градусах Цельсия не имеет физического смысла."]],
kk:["Қыздырылған баллон", "Жабық баллондағы газ $t_1 = 27\\ ^\\circ$C температурада және $p_1 = 2 \\cdot 10^5$ Па қысымда тұр. Баллонды $t_2 = 127\\ ^\\circ$C-қа дейін қыздырды.", ["Газдың қысымы қандай болды?", "Неліктен 127-ні 27-ге жай бөлуге болмайды?"], ["Баллонның көлемі өзгермейді — бұл изохоралық процесс: $\\dfrac{p}{T} = \\text{const}$.", "Газ заңдарында температура абсолют: $T = t + 273$.", "$p_2 = p_1 \\dfrac{T_2}{T_1}$. Цельсий градусындағы температуралардың қатынасының физикалық мағынасы жоқ."]],
en:["Heated cylinder", "Gas in a closed cylinder is at temperature $t_1 = 27\\ ^\\circ$C and pressure $p_1 = 2 \\cdot 10^5$ Pa. The cylinder is heated to $t_2 = 127\\ ^\\circ$C.", ["What is the new pressure?", "Why can’t you just divide 127 by 27?"], ["The volume doesn’t change — an isochoric process: $\\dfrac{p}{T} = \\text{const}$.", "Gas laws use absolute temperature: $T = t + 273$.", "$p_2 = p_1 \\dfrac{T_2}{T_1}$. A ratio of Celsius temperatures has no physical meaning."]]},
{id:22,tp:8,lvl:3,keys:["бойл|изотерм|isotherm|boyle|pV ?=|p ?V ?= ?const", "ρ ?g ?h|\\\\rho ?g ?h|гидростат|hydrostat", "(^|[^0-9])3 ?см|(^|[^0-9])3 ?cm|V ?= ?3|втрое|үш есе|three times|tripl"],
ru:["Пузырёк со дна озера", "Со дна озера глубиной $h = 20$ м поднимается пузырёк воздуха объёмом $V_1 = 1$ см³. Температура воды всюду одинаковая. Атмосферное давление $p_0 = 10^5$ Па, $\\rho = 1000$ кг/м³, $g = 10$ м/с².", ["Каким будет объём пузырька у поверхности?"], ["Температура постоянна — процесс изотермический: $pV = \\text{const}$.", "Давление на дне складывается из атмосферного и давления столба воды: $p_1 = p_0 + \\rho g h$.", "$V_2 = V_1 \\dfrac{p_1}{p_0}$. Сравни $\\rho g h$ с $p_0$ — во сколько раз давление на дне больше?"]],
kk:["Көл түбінен шыққан көпіршік", "Тереңдігі $h = 20$ м көлдің түбінен көлемі $V_1 = 1$ см³ ауа көпіршігі көтеріледі. Судың температурасы барлық жерде бірдей. Атмосфералық қысым $p_0 = 10^5$ Па, $\\rho = 1000$ кг/м³, $g = 10$ м/с².", ["Беткі қабатта көпіршіктің көлемі қандай болады?"], ["Температура тұрақты — процесс изотермиялық: $pV = \\text{const}$.", "Түбіндегі қысым атмосфералық қысым мен су бағанының қысымынан тұрады: $p_1 = p_0 + \\rho g h$.", "$V_2 = V_1 \\dfrac{p_1}{p_0}$. $\\rho g h$-ты $p_0$-мен салыстыр — түбіндегі қысым неше есе үлкен?"]],
en:["Bubble from the lake bottom", "An air bubble of volume $V_1 = 1$ cm³ rises from the bottom of a lake $h = 20$ m deep. The water temperature is the same everywhere. Atmospheric pressure $p_0 = 10^5$ Pa, $\\rho = 1000$ kg/m³, $g = 10$ m/s².", ["What will the bubble’s volume be at the surface?"], ["The temperature is constant — an isothermal process: $pV = \\text{const}$.", "The pressure at the bottom is atmospheric plus the water column: $p_1 = p_0 + \\rho g h$.", "$V_2 = V_1 \\dfrac{p_1}{p_0}$. Compare $\\rho g h$ with $p_0$ — how many times larger is the pressure at the bottom?"]]},
{id:23,tp:2,lvl:1,keys:["кпд|к\\.п\\.д|пайдалы әсер|efficien|η|\\\\eta", "мощност|қуат|power|P ?t|Pt", "84|0[,.]84"],
ru:["КПД чайника", "Электрочайник мощностью $P = 2$ кВт за $\\tau = 5$ мин нагревает $m = 1{,}5$ кг воды от $20\\ ^\\circ$C до кипения ($100\\ ^\\circ$C). $c = 4200$ Дж/(кг·°C).", ["Сколько теплоты получила вода?", "Каков КПД чайника?"], ["Полезная теплота: $Q = cm\\,\\Delta t$.", "Затраченная энергия — работа тока: $A = P\\tau$. Время переведи в секунды.", "$\\eta = \\dfrac{Q}{A} \\cdot 100\\%$. КПД не может быть больше 100% — хорошая проверка."]],
kk:["Шәйнектің ПӘК-і", "Қуаты $P = 2$ кВт электр шәйнек $\\tau = 5$ минутта $m = 1{,}5$ кг суды $20\\ ^\\circ$C-тан қайнағанға дейін ($100\\ ^\\circ$C) қыздырады. $c = 4200$ Дж/(кг·°C).", ["Су қанша жылу алды?", "Шәйнектің ПӘК-і қандай?"], ["Пайдалы жылу: $Q = cm\\,\\Delta t$.", "Жұмсалған энергия — токтың жұмысы: $A = P\\tau$. Уақытты секундқа аудар.", "$\\eta = \\dfrac{Q}{A} \\cdot 100\\%$. ПӘК 100%-дан артық бола алмайды — жақсы тексеру."]],
en:["Kettle efficiency", "A $P = 2$ kW electric kettle heats $m = 1.5$ kg of water from $20\\ ^\\circ$C to boiling ($100\\ ^\\circ$C) in $\\tau = 5$ min. $c = 4200$ J/(kg·°C).", ["How much heat did the water receive?", "What is the kettle’s efficiency?"], ["Useful heat: $Q = cm\\,\\Delta t$.", "Energy spent is the electrical work: $A = P\\tau$. Convert the time to seconds.", "$\\eta = \\dfrac{Q}{A} \\cdot 100\\%$. Efficiency can’t exceed 100% — a good check."]]},
{id:24,tp:3,lvl:1,keys:["мощност|қуат|power", "484", "0[,.]45", "(^|[^0-9])25 ?Вт|(^|[^0-9])25 ?W|P ?= ?25|в 4 раза|4 есе|four times|quarter"],
ru:["Лампа на 220 В", "На лампе написано «220 В, 100 Вт». Сопротивление нити считайте постоянным.", ["Чему равно сопротивление лампы и ток через неё при нормальной работе?", "Какой будет мощность, если включить лампу в сеть 110 В?"], ["Мощность $P = UI = \\dfrac{U^2}{R}$, отсюда $R = \\dfrac{U^2}{P}$.", "Ток: $I = \\dfrac{P}{U}$.", "При постоянном $R$ мощность пропорциональна $U^2$: напряжение вдвое меньше — мощность…?"]],
kk:["220 В-тық шам", "Шамда «220 В, 100 Вт» деп жазылған. Қылдың кедергісін тұрақты деп есепте.", ["Қалыпты жұмыс кезінде шамның кедергісі және ол арқылы өтетін ток неге тең?", "Шамды 110 В желіге қосса, қуаты қандай болады?"], ["Қуат $P = UI = \\dfrac{U^2}{R}$, бұдан $R = \\dfrac{U^2}{P}$.", "Ток: $I = \\dfrac{P}{U}$.", "$R$ тұрақты болса, қуат $U^2$-қа пропорционал: кернеу екі есе аз — қуат…?"]],
en:["A 220 V bulb", "A bulb is labelled “220 V, 100 W”. Treat the filament resistance as constant.", ["What is the bulb’s resistance and the current through it in normal operation?", "What will its power be on a 110 V supply?"], ["Power $P = UI = \\dfrac{U^2}{R}$, so $R = \\dfrac{U^2}{P}$.", "Current: $I = \\dfrac{P}{U}$.", "With constant $R$, power is proportional to $U^2$: half the voltage means the power is…?"]]},
{id:25,tp:3,lvl:3,keys:["полной цепи|полная цепь|толық тізбек|complete circuit|closed circuit|внутренн|ішкі|internal", "R ?= ?r|равн[оаы]? внутренн|ішкі кедергіге тең|equal to the internal", "36"],
ru:["Максимальная мощность", "Источник с ЭДС $\\mathcal{E} = 12$ В и внутренним сопротивлением $r = 1$ Ом замкнут на нагрузку сопротивлением $R$.", ["При каком $R$ мощность, выделяемая на нагрузке, максимальна?", "Чему равна эта мощность?"], ["Закон Ома для полной цепи: $I = \\dfrac{\\mathcal{E}}{R + r}$.", "Мощность на нагрузке: $P = I^2 R = \\dfrac{\\mathcal{E}^2 R}{(R+r)^2}$. Исследуй её на максимум (производная или неравенство о средних).", "Ответ получается красивый: максимум достигается, когда $R$ равно $r$. Подставь и найди $P_{\\max} = \\dfrac{\\mathcal{E}^2}{4r}$."]],
kk:["Ең үлкен қуат", "ЭҚК-і $\\mathcal{E} = 12$ В және ішкі кедергісі $r = 1$ Ом көз кедергісі $R$ жүктемеге тұйықталған.", ["$R$ қандай болғанда жүктемеде бөлінетін қуат ең үлкен болады?", "Бұл қуат неге тең?"], ["Толық тізбек үшін Ом заңы: $I = \\dfrac{\\mathcal{E}}{R + r}$.", "Жүктемедегі қуат: $P = I^2 R = \\dfrac{\\mathcal{E}^2 R}{(R+r)^2}$. Оны максимумға зертте (туынды немесе орта шамалар туралы теңсіздік).", "Жауап әдемі шығады: максимум $R$ ішкі кедергіге тең болғанда орындалады. Қойып, $P_{\\max} = \\dfrac{\\mathcal{E}^2}{4r}$ тап."]],
en:["Maximum power", "A source with EMF $\\mathcal{E} = 12$ V and internal resistance $r = 1\\ \\Omega$ is connected to a load of resistance $R$.", ["For what $R$ is the power delivered to the load maximal?", "What is that power?"], ["Ohm’s law for a complete circuit: $I = \\dfrac{\\mathcal{E}}{R + r}$.", "Power in the load: $P = I^2 R = \\dfrac{\\mathcal{E}^2 R}{(R+r)^2}$. Find its maximum (derivative or the AM–GM inequality).", "The answer is neat: the maximum is reached when $R$ is equal to the internal resistance. Substitute to get $P_{\\max} = \\dfrac{\\mathcal{E}^2}{4r}$."]]},
{id:26,tp:9,lvl:1,keys:["кулон|coulomb", "0[,.]4", "в 4 раза|в четыре|4 есе|төрт есе|four times|1 ?/ ?4|quarter"],
ru:["Закон Кулона", "Два одинаковых точечных заряда по $q = 2$ мкКл находятся в вакууме на расстоянии $r = 30$ см. $k = 9 \\cdot 10^9$ Н·м²/Кл².", ["С какой силой они отталкиваются?", "Как изменится сила, если расстояние увеличить вдвое?"], ["Закон Кулона: $F = k\\dfrac{q_1 q_2}{r^2}$.", "Переведи в СИ: $2$ мкКл $= 2 \\cdot 10^{-6}$ Кл, $30$ см $= 0{,}3$ м.", "Сила обратно пропорциональна квадрату расстояния — не просто расстоянию."]],
kk:["Кулон заңы", "Әрқайсысы $q = 2$ мкКл екі бірдей нүктелік заряд вакуумда бір-бірінен $r = 30$ см қашықтықта орналасқан. $k = 9 \\cdot 10^9$ Н·м²/Кл².", ["Олар қандай күшпен тебіледі?", "Қашықтықты екі есе арттырса, күш қалай өзгереді?"], ["Кулон заңы: $F = k\\dfrac{q_1 q_2}{r^2}$.", "ХБЖ-ға аудар: $2$ мкКл $= 2 \\cdot 10^{-6}$ Кл, $30$ см $= 0{,}3$ м.", "Күш қашықтықтың өзіне емес, оның квадратына кері пропорционал."]],
en:["Coulomb’s law", "Two identical point charges $q = 2$ μC each are in vacuum, $r = 30$ cm apart. $k = 9 \\cdot 10^9$ N·m²/C².", ["With what force do they repel?", "How does the force change if the distance is doubled?"], ["Coulomb’s law: $F = k\\dfrac{q_1 q_2}{r^2}$.", "Convert to SI: $2$ μC $= 2 \\cdot 10^{-6}$ C, $30$ cm $= 0.3$ m.", "The force is inversely proportional to the square of the distance, not just the distance."]]},
{id:27,tp:9,lvl:2,keys:["ёмкост|емкост|сыйымд|capacit", "2 ?(·|\\\\cdot|\\*|x) ?10|0[,.]0002|200 ?мкКл|200 ?μC|2e-4", "0[,.]01|10 ?мДж|10 ?mJ", "200 ?В|200 ?V|вдвое|екі есе|double|twice"],
ru:["Конденсатор", "Плоский конденсатор ёмкостью $C = 2$ мкФ зарядили до напряжения $U = 100$ В и отключили от источника.", ["Чему равны заряд и энергия конденсатора?", "Каким станет напряжение, если раздвинуть пластины вдвое?"], ["$q = CU$, $W = \\dfrac{CU^2}{2}$.", "Конденсатор отключён — заряду некуда уйти, $q$ остаётся прежним.", "Ёмкость плоского конденсатора $C = \\dfrac{\\varepsilon_0 S}{d}$: при увеличении $d$ вдвое она уменьшается вдвое, а $U = \\dfrac{q}{C}$."]],
kk:["Конденсатор", "Сыйымдылығы $C = 2$ мкФ жазық конденсаторды $U = 100$ В кернеуге дейін зарядтап, көзден ажыратты.", ["Конденсатордың заряды мен энергиясы неге тең?", "Пластиналарды екі есе алыстатса, кернеу қандай болады?"], ["$q = CU$, $W = \\dfrac{CU^2}{2}$.", "Конденсатор ажыратылған — зарядтың кететін жері жоқ, $q$ өзгермейді.", "Жазық конденсатордың сыйымдылығы $C = \\dfrac{\\varepsilon_0 S}{d}$: $d$ екі есе артса, ол екі есе азаяды, ал $U = \\dfrac{q}{C}$."]],
en:["Capacitor", "A parallel-plate capacitor of capacitance $C = 2$ μF is charged to $U = 100$ V and disconnected from the source.", ["What are its charge and energy?", "What will the voltage be if the plates are pulled twice as far apart?"], ["$q = CU$, $W = \\dfrac{CU^2}{2}$.", "The capacitor is disconnected, so the charge has nowhere to go — $q$ stays the same.", "For a parallel-plate capacitor $C = \\dfrac{\\varepsilon_0 S}{d}$: doubling $d$ halves $C$, and $U = \\dfrac{q}{C}$."]]},
{id:28,tp:9,lvl:3,keys:["tg|tan|тангенс", "равновес|тепе-тең|equilibr", "10 ?\\^? ?\\{?-6|1 ?мкКл|1 ?μC|1 ?uC|0[,.]000001|1e-6"],
ru:["Шарик в электрическом поле", "Маленький заряженный шарик массой $m = 1$ г висит на нити в однородном горизонтальном электрическом поле напряжённостью $E = 10^4$ В/м. В равновесии нить отклонилась от вертикали на угол $\\alpha = 45^\\circ$. $g = 10$ м/с².", ["Чему равен заряд шарика?"], ["На шарик действуют три силы: тяжести $mg$ (вниз), электрическая $qE$ (горизонтально) и натяжение нити $T$.", "В равновесии сумма сил равна нулю. Удобно спроецировать на вертикаль и горизонталь — или сразу из треугольника сил.", "Из треугольника сил: $\\operatorname{tg}\\alpha = \\dfrac{qE}{mg}$. При $45^\\circ$ тангенс равен 1."]],
kk:["Электр өрісіндегі шарик", "Массасы $m = 1$ г кішкентай зарядталған шарик кернеулігі $E = 10^4$ В/м біртекті көлденең электр өрісінде жіпке ілініп тұр. Тепе-теңдікте жіп тіктен $\\alpha = 45^\\circ$ бұрышқа ауытқыды. $g = 10$ м/с².", ["Шариктің заряды неге тең?"], ["Шарикке үш күш әсер етеді: ауырлық $mg$ (төмен), электрлік $qE$ (көлденең) және жіптің керілуі $T$.", "Тепе-теңдікте күштердің қосындысы нөлге тең. Тік және көлденең осьтерге проекциялау ыңғайлы — немесе бірден күштер үшбұрышынан.", "Күштер үшбұрышынан: $\\operatorname{tg}\\alpha = \\dfrac{qE}{mg}$. $45^\\circ$ кезінде тангенс 1-ге тең."]],
en:["Charged ball in a field", "A small charged ball of mass $m = 1$ g hangs on a thread in a uniform horizontal electric field $E = 10^4$ V/m. In equilibrium the thread is deflected $\\alpha = 45^\\circ$ from the vertical. $g = 10$ m/s².", ["What is the ball’s charge?"], ["Three forces act on the ball: gravity $mg$ (down), the electric force $qE$ (horizontal) and the tension $T$.", "In equilibrium the forces sum to zero. Project onto vertical and horizontal — or use the force triangle directly.", "From the force triangle: $\\tan\\alpha = \\dfrac{qE}{mg}$. At $45^\\circ$ the tangent equals 1."]]},
{id:29,tp:10,lvl:1,keys:["ампер|ampere", "BIL|B ?I ?L|IBL|ILB|I ?B ?l|BIl", "0[,.]4", "0[,.]2"],
ru:["Сила Ампера", "Прямой проводник длиной $L = 0{,}5$ м с током $I = 4$ А находится в однородном магнитном поле с индукцией $B = 0{,}2$ Тл.", ["Какая сила действует на проводник, если он перпендикулярен линиям поля?", "А если проводник расположен под углом $30^\\circ$ к линиям поля?"], ["Сила Ампера: $F = BIL\\sin\\alpha$, где $\\alpha$ — угол между проводником и вектором $\\vec B$.", "При $\\alpha = 90^\\circ$ синус равен 1.", "$\\sin 30^\\circ = \\tfrac12$. Направление силы — по правилу левой руки."]],
kk:["Ампер күші", "Ұзындығы $L = 0{,}5$ м, тогы $I = 4$ А түзу өткізгіш индукциясы $B = 0{,}2$ Тл біртекті магнит өрісінде тұр.", ["Өткізгіш өріс сызықтарына перпендикуляр болса, оған қандай күш әсер етеді?", "Ал өткізгіш өріс сызықтарына $30^\\circ$ бұрышпен орналасса ше?"], ["Ампер күші: $F = BIL\\sin\\alpha$, мұндағы $\\alpha$ — өткізгіш пен $\\vec B$ векторы арасындағы бұрыш.", "$\\alpha = 90^\\circ$ болғанда синус 1-ге тең.", "$\\sin 30^\\circ = \\tfrac12$. Күштің бағыты — сол қол ережесі бойынша."]],
en:["Ampère force", "A straight wire of length $L = 0.5$ m carrying current $I = 4$ A is in a uniform magnetic field $B = 0.2$ T.", ["What force acts on the wire if it is perpendicular to the field lines?", "What if the wire makes a $30^\\circ$ angle with the field lines?"], ["The Ampère force: $F = BIL\\sin\\alpha$, where $\\alpha$ is the angle between the wire and $\\vec B$.", "At $\\alpha = 90^\\circ$ the sine equals 1.", "$\\sin 30^\\circ = \\tfrac12$. The direction follows the left-hand rule."]]},
{id:30,tp:10,lvl:2,keys:["лоренц|lorentz", "центростремит|центрге тартқыш|centripetal|mv ?\\^? ?2|mv²|qvB ?=|q ?v ?B ?=", "0[,.]10|0[,.]104|(^|[^0-9])10 ?см|(^|[^0-9])10 ?cm|0[,.]1 ?м|0[,.]1 ?m", "не соверш|равна нул|равна 0|нөлге тең|жұмыс істемейді|zero|no work|does no work"],
ru:["Протон в магнитном поле", "Протон влетает в однородное магнитное поле с индукцией $B = 0{,}1$ Тл со скоростью $v = 10^6$ м/с перпендикулярно линиям поля. $m_p = 1{,}67 \\cdot 10^{-27}$ кг, $e = 1{,}6 \\cdot 10^{-19}$ Кл.", ["По какой траектории движется протон и каков её радиус?", "Какую работу совершает над протоном сила Лоренца?"], ["Сила Лоренца $F = evB$ всегда перпендикулярна скорости.", "Она играет роль центростремительной силы: $evB = \\dfrac{m v^2}{R}$.", "Сила, перпендикулярная скорости, не меняет модуль скорости — значит, кинетическая энергия постоянна."]],
kk:["Магнит өрісіндегі протон", "Протон индукциясы $B = 0{,}1$ Тл біртекті магнит өрісіне өріс сызықтарына перпендикуляр $v = 10^6$ м/с жылдамдықпен ұшып кіреді. $m_p = 1{,}67 \\cdot 10^{-27}$ кг, $e = 1{,}6 \\cdot 10^{-19}$ Кл.", ["Протон қандай траекториямен қозғалады және оның радиусы қандай?", "Лоренц күші протонға қандай жұмыс жасайды?"], ["Лоренц күші $F = evB$ әрқашан жылдамдыққа перпендикуляр.", "Ол центрге тартқыш күштің рөлін атқарады: $evB = \\dfrac{m v^2}{R}$.", "Жылдамдыққа перпендикуляр күш жылдамдықтың модулін өзгертпейді — демек, кинетикалық энергия тұрақты."]],
en:["Proton in a magnetic field", "A proton enters a uniform magnetic field $B = 0.1$ T at $v = 10^6$ m/s perpendicular to the field lines. $m_p = 1.67 \\cdot 10^{-27}$ kg, $e = 1.6 \\cdot 10^{-19}$ C.", ["What path does the proton follow, and what is its radius?", "How much work does the Lorentz force do on the proton?"], ["The Lorentz force $F = evB$ is always perpendicular to the velocity.", "It acts as the centripetal force: $evB = \\dfrac{m v^2}{R}$.", "A force perpendicular to the velocity doesn’t change its magnitude — so the kinetic energy stays constant."]]},
{id:31,tp:10,lvl:3,keys:["момент|moment|torque", "NIBS|N ?I ?B ?S|виток|витк|орам|turns", "0[,.]5", "нол|нул|нөл|zero|(^|[^0-9])0 ?Н"],
ru:["Рамка с током", "Квадратная рамка со стороной $a = 10$ см содержит $N = 50$ витков, по ним течёт ток $I = 2$ А. Рамка находится в однородном магнитном поле $B = 0{,}5$ Тл.", ["Чему равен вращающий момент, когда плоскость рамки параллельна линиям поля?", "А когда плоскость рамки перпендикулярна линиям поля?"], ["На две стороны рамки действуют силы Ампера, направленные в разные стороны, — они создают пару сил.", "Для рамки момент $M = NIBS\\sin\\varphi$, где $\\varphi$ — угол между нормалью к рамке и $\\vec B$, $S = a^2$.", "Когда плоскость параллельна полю, нормаль перпендикулярна $\\vec B$ — момент максимален. В перпендикулярном положении силы лежат на одной прямой."]],
kk:["Тогы бар рамка", "Қабырғасы $a = 10$ см шаршы рамкада $N = 50$ орам бар, олар арқылы $I = 2$ А ток өтеді. Рамка $B = 0{,}5$ Тл біртекті магнит өрісінде тұр.", ["Рамканың жазықтығы өріс сызықтарына параллель болғанда айналдырушы момент неге тең?", "Ал рамканың жазықтығы өріс сызықтарына перпендикуляр болғанда ше?"], ["Рамканың екі қабырғасына қарама-қарсы бағытталған Ампер күштері әсер етеді — олар күштер жұбын жасайды.", "Рамка үшін момент $M = NIBS\\sin\\varphi$, мұндағы $\\varphi$ — рамкаға нормаль мен $\\vec B$ арасындағы бұрыш, $S = a^2$.", "Жазықтық өріске параллель болғанда нормаль $\\vec B$-ға перпендикуляр — момент ең үлкен. Перпендикуляр күйде күштер бір түзудің бойында жатады."]],
en:["Current loop", "A square coil with side $a = 10$ cm has $N = 50$ turns carrying current $I = 2$ A. The coil is in a uniform magnetic field $B = 0.5$ T.", ["What is the torque when the plane of the coil is parallel to the field lines?", "And when the plane of the coil is perpendicular to the field lines?"], ["Ampère forces on two sides of the coil point in opposite directions — they form a couple.", "For a coil the torque is $M = NIBS\\sin\\varphi$, where $\\varphi$ is the angle between the coil’s normal and $\\vec B$, and $S = a^2$.", "When the plane is parallel to the field, the normal is perpendicular to $\\vec B$ — maximum torque. In the perpendicular position the forces lie on one line."]]},
{id:32,tp:11,lvl:2,keys:["эдс индукц|индукц|индукция|induc", "BLv|B ?L ?v|Blv|vBL|B ?l ?v", "0[,.]4 ?В|0[,.]4 ?V|= ?0[,.]4", "0[,.]016|16 ?мН|16 ?mN"],
ru:["Стержень на рельсах", "Металлический стержень длиной $L = 0{,}4$ м скользит со скоростью $v = 5$ м/с по горизонтальным рельсам, замкнутым на резистор $R = 2$ Ом. Вертикальное магнитное поле $B = 0{,}2$ Тл. Сопротивлением стержня и рельсов пренебрегите.", ["Чему равна ЭДС индукции и ток в цепи?", "Какую силу нужно прикладывать к стержню, чтобы он двигался равномерно?"], ["Движущийся проводник в магнитном поле — источник ЭДС: $\\mathcal{E} = BLv$.", "Ток $I = \\dfrac{\\mathcal{E}}{R}$. На проводник с током в поле действует сила Ампера $F_A = BIL$.", "По правилу Ленца сила Ампера тормозит стержень. Равномерное движение: внешняя сила равна $F_A$."]],
kk:["Рельстегі өзек", "Ұзындығы $L = 0{,}4$ м металл өзек $R = 2$ Ом резисторға тұйықталған көлденең рельстермен $v = 5$ м/с жылдамдықпен сырғанайды. Тік магнит өрісі $B = 0{,}2$ Тл. Өзек пен рельстердің кедергісін ескерме.", ["Индукция ЭҚК-і және тізбектегі ток неге тең?", "Өзек бірқалыпты қозғалуы үшін оған қандай күш түсіру керек?"], ["Магнит өрісінде қозғалатын өткізгіш — ЭҚК көзі: $\\mathcal{E} = BLv$.", "Ток $I = \\dfrac{\\mathcal{E}}{R}$. Өрістегі тогы бар өткізгішке Ампер күші әсер етеді: $F_A = BIL$.", "Ленц ережесі бойынша Ампер күші өзекті тежейді. Бірқалыпты қозғалыс: сыртқы күш $F_A$-ға тең."]],
en:["Rod on rails", "A metal rod of length $L = 0.4$ m slides at $v = 5$ m/s along horizontal rails connected to a resistor $R = 2\\ \\Omega$. A vertical magnetic field $B = 0.2$ T is present. Neglect the resistance of the rod and rails.", ["What are the induced EMF and the current?", "What force must be applied to the rod to keep it moving at constant speed?"], ["A conductor moving in a magnetic field is a source of EMF: $\\mathcal{E} = BLv$.", "Current $I = \\dfrac{\\mathcal{E}}{R}$. A current-carrying conductor in a field feels the Ampère force $F_A = BIL$.", "By Lenz’s rule the Ampère force brakes the rod. Constant speed: the applied force equals $F_A$."]]},
{id:33,tp:11,lvl:3,keys:["фараде|faraday|поток|ағын|flux", "ленц|lenz", "(^|[^0-9.,])2 ?В|(^|[^0-9.,])2 ?V|= ?2 ?В", "0[,.]02"],
ru:["Катушка в убывающем поле", "Катушка из $N = 200$ витков площадью $S = 20$ см² находится в однородном магнитном поле, перпендикулярном её виткам. Индукция поля равномерно уменьшается от $0{,}5$ Тл до нуля за $\\Delta t = 0{,}1$ с. Катушка замкнута, её сопротивление $R = 10$ Ом.", ["Чему равна ЭДС индукции?", "Какой заряд пройдёт по катушке?", "Как направлен индукционный ток?"], ["Закон Фарадея: $\\mathcal{E} = N\\dfrac{\\Delta\\Phi}{\\Delta t}$, где $\\Phi = BS$. Площадь переведи в м².", "Заряд $q = I\\Delta t = \\dfrac{\\mathcal{E}}{R}\\Delta t = \\dfrac{N\\Delta\\Phi}{R}$ — от времени он не зависит!", "Правило Ленца: индукционный ток своим полем мешает изменению потока — поддерживает убывающее поле."]],
kk:["Кемитін өрістегі катушка", "$N = 200$ орамды, ауданы $S = 20$ см² катушка өзінің орамдарына перпендикуляр біртекті магнит өрісінде тұр. Өріс индукциясы $\\Delta t = 0{,}1$ с ішінде $0{,}5$ Тл-дан нөлге дейін бірқалыпты кемиді. Катушка тұйықталған, оның кедергісі $R = 10$ Ом.", ["Индукция ЭҚК-і неге тең?", "Катушка арқылы қандай заряд өтеді?", "Индукциялық ток қалай бағытталған?"], ["Фарадей заңы: $\\mathcal{E} = N\\dfrac{\\Delta\\Phi}{\\Delta t}$, мұндағы $\\Phi = BS$. Ауданды м²-ге аудар.", "Заряд $q = I\\Delta t = \\dfrac{\\mathcal{E}}{R}\\Delta t = \\dfrac{N\\Delta\\Phi}{R}$ — ол уақытқа тәуелсіз!", "Ленц ережесі: индукциялық ток өз өрісімен ағынның өзгеруіне кедергі жасайды — кемитін өрісті қолдайды."]],
en:["Coil in a decreasing field", "A coil of $N = 200$ turns with area $S = 20$ cm² is in a uniform magnetic field perpendicular to its turns. The field decreases uniformly from $0.5$ T to zero in $\\Delta t = 0.1$ s. The coil is closed, with resistance $R = 10\\ \\Omega$.", ["What is the induced EMF?", "What charge flows through the coil?", "Which way does the induced current flow?"], ["Faraday’s law: $\\mathcal{E} = N\\dfrac{\\Delta\\Phi}{\\Delta t}$, where $\\Phi = BS$. Convert the area to m².", "Charge $q = I\\Delta t = \\dfrac{\\mathcal{E}}{R}\\Delta t = \\dfrac{N\\Delta\\Phi}{R}$ — it doesn’t depend on the time!", "Lenz’s rule: the induced current’s own field opposes the change in flux — it supports the decreasing field."]]},
{id:34,tp:12,lvl:1,keys:["отраж|шағыл|reflect", "угол падения|равен углу|түсу бұрышы|angle of incidence|equals the angle", "0[,.]9|90 ?см|90 ?cm|половин|жарты|half", "не завис|тәуелсіз|тәуелді емес|independent|does not depend|doesn"],
ru:["Зеркало в полный рост", "Человек ростом $H = 1{,}8$ м хочет видеть себя в вертикальном плоском зеркале целиком.", ["Какой наименьшей высоты должно быть зеркало?", "Зависит ли ответ от расстояния до зеркала?"], ["Нарисуй ход лучей от макушки и от ступней до глаз. Угол падения равен углу отражения.", "Каждый луч отражается в точке, лежащей посередине по высоте между глазом и точкой тела.", "Значит, нужна ровно половина роста. Расстояние до зеркала в построение не входит — проверь, подойдя ближе к зеркалу дома."]],
kk:["Толық бойлық айна", "Бойы $H = 1{,}8$ м адам тік жазық айнадан өзін толық көргісі келеді.", ["Айнаның ең кіші биіктігі қандай болуы керек?", "Жауап айнаға дейінгі қашықтыққа тәуелді ме?"], ["Төбеден және табаннан көзге дейінгі сәулелердің жолын сыз. Түсу бұрышы шағылу бұрышына тең.", "Әр сәуле көз бен дене нүктесінің биіктік бойынша дәл ортасындағы нүктеде шағылады.", "Демек, бойдың дәл жартысы керек. Айнаға дейінгі қашықтық салуға кірмейді — үйде айнаға жақындап тексер."]],
en:["Full-length mirror", "A person $H = 1.8$ m tall wants to see their whole body in a vertical flat mirror.", ["What is the minimum height of the mirror?", "Does the answer depend on the distance to the mirror?"], ["Draw the rays from the top of the head and from the feet to the eyes. The angle of incidence equals the angle of reflection.", "Each ray reflects at a point halfway in height between the eye and the body point.", "So exactly half the height is needed. The distance to the mirror doesn’t enter the construction — check it at home by stepping closer."]]},
{id:35,tp:12,lvl:2,keys:["формул[а-я]* линз|линза формуласы|lens (formula|equation)|1 ?/ ?F|\\\\frac\\{?1\\}?\\{?F", "(^|[^0-9])15", "0[,.]5|вдвое меньш|в 2 раза меньш|екі есе кіші|half", "действит|перевёрн|перевернут|нақты|төңкерілген|real|inverted"],
ru:["Собирающая линза", "Предмет стоит на расстоянии $d = 30$ см от собирающей линзы с фокусным расстоянием $F = 10$ см.", ["На каком расстоянии от линзы получится изображение?", "Каково увеличение и какое это изображение?"], ["Формула тонкой линзы: $\\dfrac{1}{d} + \\dfrac{1}{f} = \\dfrac{1}{F}$.", "Увеличение $\\Gamma = \\dfrac{f}{d}$.", "Предмет дальше двойного фокуса — изображение действительное, перевёрнутое и уменьшенное. Сделай построение, чтобы убедиться."]],
kk:["Жинағыш линза", "Зат фокус аралығы $F = 10$ см жинағыш линзадан $d = 30$ см қашықтықта тұр.", ["Кескін линзадан қандай қашықтықта шығады?", "Үлкейту қандай және бұл қандай кескін?"], ["Жұқа линза формуласы: $\\dfrac{1}{d} + \\dfrac{1}{f} = \\dfrac{1}{F}$.", "Үлкейту $\\Gamma = \\dfrac{f}{d}$.", "Зат қос фокустан алыс — кескін нақты, төңкерілген және кішірейген. Көз жеткізу үшін салып көр."]],
en:["Converging lens", "An object stands $d = 30$ cm from a converging lens with focal length $F = 10$ cm.", ["How far from the lens is the image?", "What is the magnification, and what kind of image is it?"], ["Thin lens equation: $\\dfrac{1}{d} + \\dfrac{1}{f} = \\dfrac{1}{F}$.", "Magnification $\\Gamma = \\dfrac{f}{d}$.", "The object is beyond twice the focal length — the image is real, inverted and smaller. Draw the rays to check."]]},
{id:36,tp:12,lvl:3,keys:["полное внутрен|полного внутрен|толық ішкі|total internal", "снелл|snell|преломлен|сыну|refract|sin ?\\\\?alpha|n_1|n1", "41[,.]8|(^|[^0-9])42", "62|63|0[,.]88|0[,.]89"],
ru:["Полное внутреннее отражение", "Луч света выходит из стекла с показателем преломления $n = 1{,}5$ в воздух.", ["Чему равен предельный угол полного внутреннего отражения?", "Выйдет ли в воздух луч, падающий на границу под углом $45^\\circ$?", "Каким будет предельный угол, если за стеклом не воздух, а вода ($n_{\\text{в}} = 1{,}33$)?"], ["Закон преломления: $n_1 \\sin\\alpha = n_2 \\sin\\beta$.", "Предельный угол — когда преломлённый луч скользит вдоль границы, $\\beta = 90^\\circ$: $\\sin\\alpha_0 = \\dfrac{n_2}{n_1}$.", "Если угол падения больше $\\alpha_0$, свет полностью отражается. Для воды подставь $n_2 = 1{,}33$ — угол станет больше."]],
kk:["Толық ішкі шағылу", "Жарық сәулесі сыну көрсеткіші $n = 1{,}5$ шыныдан ауаға шығады.", ["Толық ішкі шағылудың шекті бұрышы неге тең?", "Шекараға $45^\\circ$ бұрышпен түскен сәуле ауаға шыға ма?", "Шынының ар жағында ауа емес, су ($n_{\\text{с}} = 1{,}33$) болса, шекті бұрыш қандай болады?"], ["Сыну заңы: $n_1 \\sin\\alpha = n_2 \\sin\\beta$.", "Шекті бұрыш — сынған сәуле шекараның бойымен сырғанайды, $\\beta = 90^\\circ$: $\\sin\\alpha_0 = \\dfrac{n_2}{n_1}$.", "Түсу бұрышы $\\alpha_0$-дан үлкен болса, жарық толық шағылады. Су үшін $n_2 = 1{,}33$ қой — бұрыш үлкейеді."]],
en:["Total internal reflection", "A light ray goes from glass with refractive index $n = 1.5$ into air.", ["What is the critical angle for total internal reflection?", "Will a ray hitting the boundary at $45^\\circ$ get out into the air?", "What is the critical angle if there is water ($n_{\\text{w}} = 1.33$) behind the glass instead of air?"], ["Snell’s law: $n_1 \\sin\\alpha = n_2 \\sin\\beta$.", "At the critical angle the refracted ray grazes the boundary, $\\beta = 90^\\circ$: $\\sin\\alpha_0 = \\dfrac{n_2}{n_1}$.", "If the angle of incidence exceeds $\\alpha_0$, the light is totally reflected. For water use $n_2 = 1.33$ — the angle gets larger."]]}
