{id:'m1',tp:0,pid:null,ok:false,
ru:['Сила нужна, чтобы тело двигалось','Чтобы тело двигалось с постоянной скоростью, на него должна постоянно действовать сила.','Неверно. По первому закону Ньютона, если равнодействующая всех сил равна нулю, тело само движется равномерно и прямолинейно. Сила нужна, чтобы изменить скорость, а не чтобы её поддерживать. Тележку мы толкаем только чтобы скомпенсировать трение — тогда сумма сил снова равна нулю. Частный случай «есть трение» не превращается в общий закон.'],
kk:['Қозғалыс үшін күш керек','Дене тұрақты жылдамдықпен қозғалуы үшін оған үнемі күш әсер етуі керек.','Қате. Ньютонның бірінші заңы бойынша барлық күштердің тең әсерлі күші нөлге тең болса, дене өздігінен бірқалыпты түзу сызықты қозғалады. Күш жылдамдықты сақтау үшін емес, оны өзгерту үшін керек. Арбаны тек үйкелісті теңестіру үшін итереміз — сонда күштердің қосындысы қайтадан нөлге тең. «Үйкеліс бар» деген жеке жағдай жалпы заңға айналмайды.'],
en:['Force is needed to keep moving','For a body to move at constant velocity, a force must act on it all the time.','False. By Newton’s first law, if the net force is zero, a body keeps moving uniformly in a straight line on its own. Force is needed to change velocity, not to maintain it. We push a cart only to cancel friction, so the net force is again zero. The special case “there is friction” is not a general law.']},
{id:'m2',tp:0,pid:1,ok:false,
ru:['Средняя скорость = среднее скоростей','Средняя скорость всегда равна среднему арифметическому скоростей на участках пути.','Неверно. Средняя скорость — это весь путь, делённый на всё время. Со средним арифметическим она совпадает только в частном случае, когда тело двигалось с каждой скоростью одинаковое время. Если одинаковы участки пути, на медленном участке тело проводит больше времени, и средняя скорость меньше среднего арифметического.'],
kk:['Орташа жылдамдық = жылдамдықтардың ортасы','Орташа жылдамдық әрқашан жол бөліктеріндегі жылдамдықтардың арифметикалық ортасына тең.','Қате. Орташа жылдамдық — бүкіл жолды бүкіл уақытқа бөлгенге тең. Ол арифметикалық ортамен дене әр жылдамдықпен бірдей уақыт қозғалған жеке жағдайда ғана сәйкес келеді. Жол бөліктері бірдей болса, баяу бөлікте дене көбірек уақыт өткізеді, сондықтан орташа жылдамдық арифметикалық ортадан аз болады.'],
en:['Average speed = mean of speeds','Average speed always equals the arithmetic mean of the speeds on the parts of the trip.','False. Average speed is total distance divided by total time. It equals the arithmetic mean only in the special case where the body spends equal time at each speed. If the distances are equal, the body spends more time on the slow part, so the average speed is lower than the arithmetic mean.']},
{id:'m3',tp:0,pid:null,ok:true,
ru:['Тяжёлое падает быстрее','Без сопротивления воздуха тяжёлый и лёгкий шары, отпущенные одновременно, упадут на землю одновременно.','Верно. Без сопротивления воздуха все тела падают с одинаковым ускорением $g$: на тяжёлое тело действует большая сила тяжести, но и разогнать его во столько же раз труднее. Пёрышко падает медленнее камня только из-за воздуха — это частный случай, а не общее правило.'],
kk:['Ауыр дене тезірек түседі','Ауаның кедергісі болмаса, бір мезетте жіберілген ауыр және жеңіл шарлар жерге бір мезетте түседі.','Дұрыс. Ауаның кедергісі болмаса, барлық денелер бірдей $g$ үдеумен түседі: ауыр денеге үлкен ауырлық күші әсер етеді, бірақ оны үдету де сонша есе қиын. Қауырсын тастан баяу түсуі тек ауаға байланысты — бұл жалпы ереже емес, жеке жағдай.'],
en:['Heavy objects fall faster','Without air resistance, a heavy ball and a light ball released together hit the ground at the same time.','True. Without air resistance all bodies fall with the same acceleration $g$: a heavier body has a larger gravity force, but it is also proportionally harder to accelerate. A feather falls slower than a stone only because of air — a special case, not a general rule.']},
{id:'m4',tp:0,pid:null,ok:false,
ru:['v = 0 значит a = 0','Если скорость тела в какой-то момент равна нулю, то и его ускорение в этот момент равно нулю.','Неверно. Мяч, подброшенный вверх, в верхней точке на мгновение останавливается, но его ускорение всё время равно $g$ и направлено вниз — иначе он бы так и завис в воздухе. Ускорение показывает, как меняется скорость, а не какая она сейчас.'],
kk:['v = 0 болса, a = 0','Егер дененің жылдамдығы қандай да бір мезетте нөлге тең болса, оның үдеуі де сол мезетте нөлге тең.','Қате. Жоғары лақтырылған доп ең жоғарғы нүктеде бір сәтке тоқтайды, бірақ оның үдеуі үнемі $g$-ге тең және төмен бағытталған — әйтпесе ол ауада қалқып тұрып қалар еді. Үдеу жылдамдықтың қазір қандай екенін емес, қалай өзгеретінін көрсетеді.'],
en:['v = 0 means a = 0','If a body’s velocity is zero at some instant, its acceleration at that instant is also zero.','False. A ball thrown upward stops for an instant at the top, yet its acceleration is $g$, pointing down, the whole time — otherwise it would just hang in the air. Acceleration describes how velocity changes, not what it is right now.']},
{id:'m5',tp:0,pid:7,ok:false,
ru:['Все точки колеса движутся одинаково','У колеса, которое катится без проскальзывания, все точки обода движутся относительно земли с одинаковой скоростью.','Неверно. Точка касания с землёй в каждый момент неподвижна, а верхняя точка движется со скоростью $2v$ — вдвое быстрее центра. Скорость точки обода складывается из скорости центра и скорости вращения, а они в разных точках направлены по-разному.'],
kk:['Дөңгелектің барлық нүктелері бірдей қозғалады','Сырғанаусыз домалап бара жатқан дөңгелектің шеңберіндегі барлық нүктелер жерге қатысты бірдей жылдамдықпен қозғалады.','Қате. Жермен жанасу нүктесі әр сәтте қозғалмайды, ал жоғарғы нүкте $2v$ жылдамдықпен — центрден екі есе жылдам қозғалады. Шеңбер нүктесінің жылдамдығы центрдің жылдамдығы мен айналу жылдамдығының қосындысына тең, ал олар әр нүктеде әртүрлі бағытталған.'],
en:['All points of a wheel move alike','For a wheel rolling without slipping, all points on the rim move relative to the ground at the same speed.','False. The contact point is at rest at every instant, while the top point moves at $2v$ — twice as fast as the center. A rim point’s velocity is the sum of the center’s velocity and the rotational velocity, and these point in different directions at different points.']},
{id:'m6',tp:1,pid:5,ok:true,
ru:['Архимед растёт с глубиной','Сила Архимеда, действующая на полностью погружённое тело, не зависит от глубины погружения.','Верно. Сила Архимеда равна весу вытесненной жидкости: $\\rho g V$. У полностью погружённого тела объём V не меняется, плотность воды почти не зависит от глубины — значит, и сила одинакова. С глубиной растёт давление, но разность давлений на нижнюю и верхнюю грани остаётся той же. Частая ошибка — думать, что глубже значит сильнее выталкивает.'],
kk:['Архимед күші тереңдікпен өседі','Толық батырылған денеге әсер ететін Архимед күші батыру тереңдігіне тәуелді емес.','Дұрыс. Архимед күші ығыстырылған сұйықтықтың салмағына тең: $\\rho g V$. Толық батқан дененің V көлемі өзгермейді, ал судың тығыздығы тереңдікке іс жүзінде тәуелді емес — демек, күш те бірдей. Тереңдікпен қысым өседі, бірақ төменгі және жоғарғы жақтардағы қысымдар айырмасы сол күйінде қалады. Жиі кездесетін қате — тереңірек болса, қаттырақ итереді деп ойлау.'],
en:['Buoyancy grows with depth','The buoyant force on a fully submerged body does not depend on how deep it is.','True. The buoyant force equals the weight of the displaced liquid: $\\rho g V$. For a fully submerged body V doesn’t change, and water’s density barely depends on depth — so the force is the same. Pressure grows with depth, but the pressure difference between the bottom and top faces stays the same. A common mistake is to think deeper means a stronger push.']},
{id:'m7',tp:1,pid:3,ok:false,
ru:['Тонет то, что тяжёлое','Тонет ли тело, зависит от его массы: тяжёлые тела тонут, лёгкие плавают.','Неверно. Решает не масса, а плотность тела по сравнению с плотностью жидкости. Многотонный корабль плавает, а маленький гвоздь тонет. Тело плавает, если его средняя плотность меньше плотности жидкости.'],
kk:['Ауыр зат батады','Дененің батуы оның массасына байланысты: ауыр денелер батады, жеңілдері жүзеді.','Қате. Масса емес, дененің тығыздығы мен сұйықтықтың тығыздығының арақатынасы шешеді. Көп тонналық кеме жүзеді, ал кішкентай шеге батады. Дененің орташа тығыздығы сұйықтықтың тығыздығынан аз болса, ол жүзеді.'],
en:['Heavy things sink','Whether a body sinks depends on its mass: heavy bodies sink, light ones float.','False. What matters is the body’s density compared with the liquid’s, not its mass. A ship of thousands of tonnes floats, while a small nail sinks. A body floats if its average density is less than the liquid’s.']},
{id:'m8',tp:1,pid:4,ok:false,
ru:['Давление = сила','Давление зависит только от силы: чем больше сила, тем больше давление, а площадь не важна.','Неверно. Давление — это сила, делённая на площадь: $p = \\dfrac{F}{S}$. Один и тот же кирпич давит на стол в несколько раз сильнее, если поставить его на маленькую грань. Поэтому острый нож режет, а лыжи не проваливаются в снег.'],
kk:['Қысым = күш','Қысым тек күшке байланысты: күш неғұрлым үлкен болса, қысым соғұрлым үлкен, ал аудан маңызды емес.','Қате. Қысым — күшті ауданға бөлгенге тең: $p = \\dfrac{F}{S}$. Сол бір кірпішті кіші жағына қойса, ол үстелге бірнеше есе қаттырақ қысым түсіреді. Сондықтан өткір пышақ кеседі, ал шаңғы қарға батпайды.'],
en:['Pressure = force','Pressure depends only on force: the larger the force, the larger the pressure, and area doesn’t matter.','False. Pressure is force divided by area: $p = \\dfrac{F}{S}$. The same brick presses on a table several times harder when it rests on its smallest face. That’s why a sharp knife cuts and skis don’t sink into snow.']},
{id:'m9',tp:2,pid:6,ok:false,
ru:['Теплота = температура','Теплота и температура — одно и то же: у более горячего тела всегда больше теплоты.','Неверно. Температура показывает, насколько нагрето тело, а количество теплоты — сколько энергии передано. Чтобы нагреть ванну воды на 1 °C, нужно гораздо больше теплоты, чем стакан на 10 °C. Количество теплоты зависит ещё от массы и вещества: $Q = cm\\,\\Delta t$.'],
kk:['Жылу = температура','Жылу мен температура — бір нәрсе: ыстығырақ денеде әрқашан жылу көп болады.','Қате. Температура дененің қаншалықты қызғанын көрсетеді, ал жылу мөлшері — қанша энергия берілгенін. Бір ванна суды 1 °C-қа жылыту үшін бір стақан суды 10 °C-қа жылытқаннан әлдеқайда көп жылу керек. Жылу мөлшері масса мен затқа да тәуелді: $Q = cm\\,\\Delta t$.'],
en:['Heat = temperature','Heat and temperature are the same thing: a hotter body always has more heat.','False. Temperature shows how hot a body is; the amount of heat is how much energy is transferred. Warming a bathtub of water by 1 °C takes far more heat than warming a glass by 10 °C. The amount of heat also depends on mass and substance: $Q = cm\\,\\Delta t$.']},
{id:'m10',tp:2,pid:8,ok:true,
ru:['При таянии лёд нагревается','Пока лёд тает, температура смеси льда и воды не меняется.','Верно. Во время плавления температура смеси остаётся 0 °C, пока весь лёд не растает: вся подводимая теплота идёт на разрушение кристаллической решётки, а не на нагрев ($Q = \\lambda m$). Частая ошибка — думать, что лёд при таянии постепенно нагревается.'],
kk:['Мұз ерігенде қызады','Мұз еріп жатқанда мұз бен су қоспасының температурасы өзгермейді.','Дұрыс. Балқу кезінде қоспаның температурасы бүкіл мұз ерігенше 0 °C болып қалады: берілген жылудың бәрі қыздыруға емес, кристалдық торды бұзуға жұмсалады ($Q = \\lambda m$). Жиі кездесетін қате — мұз еріген кезде біртіндеп қызады деп ойлау.'],
en:['Melting ice heats up','While ice is melting, the temperature of the ice-water mixture stays the same.','True. During melting the mixture stays at 0 °C until all the ice has melted: all the heat supplied goes into breaking the crystal lattice rather than raising the temperature ($Q = \\lambda m$). A common mistake is to think melting ice gradually warms up.']},
{id:'m11',tp:3,pid:9,ok:true,
ru:['Ток «расходуется»','В последовательной цепи ток в проводе до лампочки и после неё одинаковый.','Верно. Сколько заряда втекает в лампочку, столько и вытекает. Лампочка расходует энергию, а не заряд — поэтому падает напряжение, а не ток. Частая ошибка — думать, что ток «расходуется» и после лампочки его меньше.'],
kk:['Ток «жұмсалады»','Тізбектей жалғанған тізбекте шамға дейінгі және шамнан кейінгі сымдағы ток бірдей.','Дұрыс. Шамға қанша заряд кірсе, сонша шығады. Шам зарядты емес, энергияны жұмсайды — сондықтан ток емес, кернеу төмендейді. Жиі кездесетін қате — ток «жұмсалады», шамнан кейін ол азаяды деп ойлау.'],
en:['Current gets “used up”','In a series circuit, the current in the wire before the bulb and after it is the same.','True. As much charge flows out of the bulb as flows in. The bulb uses energy, not charge — so the voltage drops, not the current. A common mistake is to think current gets “used up” and is smaller after the bulb.']},
{id:'m12',tp:3,pid:9,ok:false,
ru:['Параллельно — значит больше','Если подключить ещё один резистор параллельно, общее сопротивление цепи увеличится.','Неверно. При параллельном подключении у тока появляется ещё один путь, поэтому общее сопротивление уменьшается: $\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}$. Сопротивления просто складываются только при последовательном соединении — это частный случай, который нельзя переносить на все цепи.'],
kk:['Параллель — көбірек','Тағы бір резисторды параллель жалғаса, тізбектің жалпы кедергісі артады.','Қате. Параллель жалғағанда ток үшін тағы бір жол пайда болады, сондықтан жалпы кедергі азаяды: $\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}$. Кедергілер тек тізбектей жалғағанда жай қосылады — бұл барлық тізбекке көшіруге болмайтын жеке жағдай.'],
en:['Parallel adds resistance','Adding another resistor in parallel increases the circuit’s total resistance.','False. A parallel resistor gives the current another path, so total resistance decreases: $\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}$. Resistances simply add only in series — a special case that can’t be carried over to every circuit.']},
{id:"m13",tp:4,pid:null,ok:false,
ru:["Сила броска продолжает действовать", "Подброшенный вверх мяч продолжает подниматься, потому что на него всё ещё действует сила броска.", "Неверно. Как только мяч оторвался от руки, сила броска перестала действовать. Без сопротивления воздуха на мяч действует только сила тяжести, и она направлена вниз. Мяч поднимается по инерции, а сила тяжести лишь уменьшает его скорость. Скорость направлена вверх, но это не значит, что туда же направлена сила."],
kk:["Лақтыру күші әсер ете береді", "Жоғары лақтырылған доп көтеріле береді, себебі оған әлі де лақтыру күші әсер етеді.", "Қате. Доп қолдан ажыраған сәтте лақтыру күші әсер етуін тоқтатты. Ауаның кедергісі болмаса, допқа тек төмен бағытталған ауырлық күші әсер етеді. Доп инерция бойынша көтеріледі, ал ауырлық күші оның жылдамдығын ғана азайтады. Жылдамдық жоғары бағытталған, бірақ бұл күш те сол жаққа бағытталған дегенді білдірмейді."],
en:["The force of the throw keeps acting", "A ball thrown upward keeps rising because the force of the throw is still acting on it.", "False. As soon as the ball leaves the hand, the force of the throw stops acting. Without air resistance, only gravity acts on the ball, and it points down. The ball rises by inertia, while gravity just reduces its speed. The velocity points up, but that doesn’t mean the force does too."]},
{id:"m14",tp:4,pid:null,ok:false,
ru:["Большее тело давит сильнее", "При столкновении грузовика с легковым автомобилем грузовик действует на легковушку с большей силой, чем легковушка на грузовик.", "Неверно. По третьему закону Ньютона силы взаимодействия всегда равны по модулю и противоположны по направлению: $\\vec F_{12} = -\\vec F_{21}$. Легковушке достаётся больше не из-за большей силы, а потому что у неё меньше масса, и та же сила даёт ей гораздо большее ускорение: $a = \\dfrac{F}{m}$."],
kk:["Үлкен дене қаттырақ әсер етеді", "Жүк көлігі жеңіл көлікпен соқтығысқанда жүк көлігі жеңіл көлікке жеңіл көліктің жүк көлігіне әсер ететін күшінен үлкен күшпен әсер етеді.", "Қате. Ньютонның үшінші заңы бойынша өзара әрекеттесу күштері әрқашан модулі бойынша тең және қарама-қарсы бағытталған: $\\vec F_{12} = -\\vec F_{21}$. Жеңіл көлікке көбірек зақым келетіні күштің үлкендігінен емес, оның массасы аз болғандықтан: сол күш оған әлдеқайда үлкен үдеу береді, $a = \\dfrac{F}{m}$."],
en:["The bigger body pushes harder", "When a truck collides with a car, the truck pushes on the car with a larger force than the car pushes on the truck.", "False. By Newton’s third law, interaction forces are always equal in magnitude and opposite in direction: $\\vec F_{12} = -\\vec F_{21}$. The car suffers more not because the force is bigger, but because its mass is smaller, so the same force gives it a much larger acceleration: $a = \\dfrac{F}{m}$."]},
{id:"m15",tp:5,pid:14,ok:true,
ru:["При неупругом ударе теряется всё", "При неупругом ударе импульс системы сохраняется, хотя часть механической энергии превращается в тепло.", "Верно. Во время короткого удара внешние силы почти не успевают изменить импульс, поэтому он сохраняется при любом ударе. А механическая энергия сохраняется только при упругом ударе. Частая ошибка — думать, что раз энергия теряется, то и импульс тоже, или наоборот, что при любом ударе сохраняется энергия."],
kk:["Серпімсіз соққыда бәрі жоғалады", "Серпімсіз соққыда жүйенің импульсі сақталады, бірақ механикалық энергияның бір бөлігі жылуға айналады.", "Дұрыс. Қысқа соққы кезінде сыртқы күштер импульсті өзгертіп үлгермейді, сондықтан ол кез келген соққыда сақталады. Ал механикалық энергия тек серпімді соққыда сақталады. Жиі кездесетін қате — энергия жоғалса, импульс те жоғалады деп ойлау немесе керісінше, кез келген соққыда энергия сақталады деп ойлау."],
en:["Everything is lost in an inelastic collision", "In an inelastic collision the system’s momentum is conserved, although part of the mechanical energy turns into heat.", "True. During a short impact, external forces have almost no time to change the momentum, so it is conserved in any collision. Mechanical energy, however, is conserved only in elastic collisions. A common mistake is to think that if energy is lost, momentum is lost too — or the reverse, that energy is conserved in every collision."]},
{id:"m16",tp:6,pid:17,ok:false,
ru:["Тяжёлое всегда перевешивает", "На рычаге более тяжёлый груз всегда перевешивает более лёгкий.", "Неверно. Равновесие рычага определяют моменты сил, а не сами силы: $F_1 l_1 = F_2 l_2$. Лёгкий груз на длинном плече может уравновесить или перевесить тяжёлый груз на коротком. Именно поэтому рычагом можно поднять то, что руками не поднять."],
kk:["Ауыр жүк әрқашан басым", "Иінтіректе ауырырақ жүк әрқашан жеңілірек жүктен басым түседі.", "Қате. Иінтіректің тепе-теңдігін күштердің өзі емес, күш моменттері анықтайды: $F_1 l_1 = F_2 l_2$. Ұзын иіндегі жеңіл жүк қысқа иіндегі ауыр жүкті теңестіре немесе одан басым түсе алады. Сондықтан иінтірекпен қолмен көтере алмайтын нәрсені көтеруге болады."],
en:["Heavier always wins", "On a lever, the heavier load always outweighs the lighter one.", "False. A lever’s balance is set by torques, not by the forces alone: $F_1 l_1 = F_2 l_2$. A light load on a long arm can balance or outweigh a heavy load on a short arm. That’s exactly why a lever lets you lift what you can’t lift by hand."]},
{id:"m17",tp:7,pid:19,ok:false,
ru:["Период зависит от размаха", "Если раскачать маятник сильнее (но колебания всё ещё малые), его период увеличится.", "Неверно. Период малых колебаний маятника не зависит от амплитуды: $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$. Чем больше размах, тем больше путь, но и скорость больше — время одного колебания остаётся тем же. Именно это свойство когда-то использовали в маятниковых часах."],
kk:["Период тербеліс ауқымына тәуелді", "Маятникті қаттырақ тербелтсе (бірақ тербелістер әлі де кіші болса), оның периоды артады.", "Қате. Маятниктің кіші тербелістерінің периоды амплитудаға тәуелді емес: $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$. Ауқым үлкен болса, жол да ұзақ, бірақ жылдамдық та үлкен — бір тербеліс уақыты өзгермейді. Бұл қасиетті бір кездері маятникті сағаттарда пайдаланған."],
en:["The period depends on the swing", "If you swing a pendulum harder (but the oscillations are still small), its period gets longer.", "False. The period of small oscillations doesn’t depend on amplitude: $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$. A bigger swing means a longer path, but also a higher speed — the time per swing stays the same. Pendulum clocks once relied on exactly this property."]},
{id:"m18",tp:8,pid:21,ok:false,
ru:["Градусы Цельсия в газовых законах", "Если нагреть газ в закрытом сосуде от $10\\ ^\\circ$C до $20\\ ^\\circ$C, его давление увеличится вдвое.", "Неверно. В газовых законах участвует абсолютная температура: $\\dfrac{p}{T} = \\text{const}$, где $T = t + 273$. Здесь $T$ растёт с 283 К до 293 К — всего примерно на 3,5%, и давление растёт так же. Отношение температур в градусах Цельсия физического смысла не имеет."],
kk:["Газ заңдарындағы Цельсий градусы", "Жабық ыдыстағы газды $10\\ ^\\circ$C-тан $20\\ ^\\circ$C-қа дейін қыздырса, оның қысымы екі есе артады.", "Қате. Газ заңдарында абсолют температура қолданылады: $\\dfrac{p}{T} = \\text{const}$, мұндағы $T = t + 273$. Мұнда $T$ 283 К-нен 293 К-ге дейін — небәрі шамамен 3,5%-ға өседі, қысым да сонша өседі. Цельсий градусындағы температуралардың қатынасының физикалық мағынасы жоқ."],
en:["Celsius in gas laws", "If gas in a closed container is heated from $10\\ ^\\circ$C to $20\\ ^\\circ$C, its pressure doubles.", "False. Gas laws use absolute temperature: $\\dfrac{p}{T} = \\text{const}$, where $T = t + 273$. Here $T$ rises from 283 K to 293 K — only about 3.5%, and so does the pressure. A ratio of Celsius temperatures has no physical meaning."]},
{id:"m19",tp:9,pid:26,ok:false,
ru:["Больший заряд тянет сильнее", "Заряд $4q$ действует на заряд $q$ с большей силой, чем заряд $q$ действует на заряд $4q$.", "Неверно. В законе Кулона $F = k\\dfrac{q_1 q_2}{r^2}$ оба заряда входят симметрично, и по третьему закону Ньютона силы равны по модулю и противоположны. Различаться будут ускорения, если различаются массы, но не силы."],
kk:["Үлкен заряд қаттырақ тартады", "$4q$ заряды $q$ зарядына $q$ зарядының $4q$ зарядына әсер ететін күшінен үлкен күшпен әсер етеді.", "Қате. Кулон заңында $F = k\\dfrac{q_1 q_2}{r^2}$ екі заряд та симметриялы кіреді, ал Ньютонның үшінші заңы бойынша күштер модулі бойынша тең және қарама-қарсы. Массалары әртүрлі болса, үдеулер ерекшеленеді, бірақ күштер емес."],
en:["The bigger charge pulls harder", "A charge $4q$ acts on a charge $q$ with a larger force than $q$ acts on $4q$.", "False. In Coulomb’s law $F = k\\dfrac{q_1 q_2}{r^2}$ both charges enter symmetrically, and by Newton’s third law the forces are equal in magnitude and opposite. The accelerations may differ if the masses differ, but the forces don’t."]},
{id:"m20",tp:10,pid:30,ok:true,
ru:["Магнитное поле разгоняет заряды", "Постоянное магнитное поле не может изменить модуль скорости заряженной частицы — только направление её движения.", "Верно. Сила Лоренца $F = qvB\\sin\\alpha$ всегда перпендикулярна скорости, поэтому её работа равна нулю и кинетическая энергия не меняется. Частица поворачивает, но не ускоряется. Разгоняет заряды электрическое поле, а не магнитное — частая путаница."],
kk:["Магнит өрісі зарядтарды үдетеді", "Тұрақты магнит өрісі зарядталған бөлшектің жылдамдығының модулін өзгерте алмайды — тек оның қозғалыс бағытын өзгертеді.", "Дұрыс. Лоренц күші $F = qvB\\sin\\alpha$ әрқашан жылдамдыққа перпендикуляр, сондықтан оның жұмысы нөлге тең және кинетикалық энергия өзгермейді. Бөлшек бұрылады, бірақ үдемейді. Зарядтарды магнит өрісі емес, электр өрісі үдетеді — жиі кездесетін шатасу."],
en:["A magnetic field speeds charges up", "A constant magnetic field cannot change the speed of a charged particle — only the direction of its motion.", "True. The Lorentz force $F = qvB\\sin\\alpha$ is always perpendicular to the velocity, so it does no work and the kinetic energy stays the same. The particle turns but doesn’t speed up. It’s the electric field, not the magnetic one, that accelerates charges — a common mix-up."]},
{id:"m21",tp:11,pid:33,ok:false,
ru:["Сильное поле — значит есть ток", "В неподвижной замкнутой катушке, находящейся в сильном постоянном магнитном поле, всё время течёт индукционный ток.", "Неверно. Индукционный ток возникает только при изменении магнитного потока: $\\mathcal{E} = -N\\dfrac{\\Delta\\Phi}{\\Delta t}$. Если поле постоянное и катушка неподвижна, поток не меняется, и тока нет, каким бы сильным ни было поле."],
kk:["Күшті өріс — демек ток бар", "Күшті тұрақты магнит өрісіндегі қозғалмайтын тұйық катушкада үнемі индукциялық ток жүреді.", "Қате. Индукциялық ток тек магнит ағыны өзгергенде пайда болады: $\\mathcal{E} = -N\\dfrac{\\Delta\\Phi}{\\Delta t}$. Өріс тұрақты және катушка қозғалмаса, ағын өзгермейді, өріс қаншалықты күшті болса да ток болмайды."],
en:["A strong field means current", "A stationary closed coil sitting in a strong constant magnetic field always carries an induced current.", "False. An induced current appears only when the magnetic flux changes: $\\mathcal{E} = -N\\dfrac{\\Delta\\Phi}{\\Delta t}$. If the field is constant and the coil doesn’t move, the flux doesn’t change and there is no current, however strong the field."]},
{id:"m22",tp:12,pid:35,ok:false,
ru:["Половина линзы — половина картинки", "Если закрыть половину собирающей линзы, на экране останется только половина изображения предмета.", "Неверно. Лучи от каждой точки предмета проходят через всю линзу, поэтому открытая половина по-прежнему собирает свет от всех точек. Изображение останется целым, но станет тусклее — света через линзу пройдёт вдвое меньше."],
kk:["Жарты линза — жарты кескін", "Жинағыш линзаның жартысын жапса, экранда заттың кескінінің тек жартысы қалады.", "Қате. Заттың әр нүктесінен шыққан сәулелер бүкіл линза арқылы өтеді, сондықтан ашық жартысы бұрынғыдай барлық нүктелерден жарық жинайды. Кескін толық қалады, бірақ күңгірттенеді — линза арқылы екі есе аз жарық өтеді."],
en:["Half a lens, half a picture", "If you cover half of a converging lens, only half of the object’s image remains on the screen.", "False. Rays from every point of the object pass through the whole lens, so the uncovered half still collects light from all points. The image stays whole, but it gets dimmer — half as much light gets through."]}
];

ru:['Два резистора по 6 Ом соединены параллельно, и к ним последовательно подключён резистор 3 Ом. Напряжение на цепи 12 В. Какой ток течёт в неразветвлённой части?',['0,8 А','1 А','2 А','4 А'],'$R = \\dfrac{6 \\cdot 6}{6 + 6} + 3 = 6$ Ом, $I = \\dfrac{U}{R} = \\dfrac{12}{6} = 2$ А.'],
kk:['Әрқайсысы 6 Ом екі резистор параллель жалғанған, оларға 3 Ом резистор тізбектей жалғанған. Тізбектегі кернеу 12 В. Тармақталмаған бөлікте қандай ток жүреді?',['0,8 А','1 А','2 А','4 А'],'$R = \\dfrac{6 \\cdot 6}{6 + 6} + 3 = 6$ Ом, $I = \\dfrac{U}{R} = \\dfrac{12}{6} = 2$ А.'],

{id:"l6",tp:4,w:2,c:1,

/* what we keep in the cloud (photos stay on this device: they are big) */
function cloudData(){
  var d={};for(var k in S){if(k==='profile')continue;d[k]=S[k]}
  if(d.contests){var c={};for(var id in d.contests){var x=Object.assign({},d.contests[id]);delete x.photo;c[id]=x}d.contests=c}
  return d;
}
var SYNC_T=null,SYNC_BUSY=false,SYNC_AGAIN=false,SYNC_WARNED=false;
function save(){
  lsSet(GKEY,G);
  if(!loggedIn())return;
  lsSet(UPRE+uid(),S);
  clearTimeout(SYNC_T);SYNC_T=setTimeout(pushCloud,1200);
}
function pushCloud(){
  if(!sb||!loggedIn())return;
  if(SYNC_BUSY){SYNC_AGAIN=true;return}
  SYNC_BUSY=true;var id=uid(),now=new Date().toISOString(),p=S.profile;
  var contests=Object.keys(S.contests||{}).filter(function(k){var c=S.contests[k];return c&&c.done&&c.rated}).length;
  Promise.all([
    sb.from('user_state').upsert({id:id,data:cloudData(),updated_at:now}),
    sb.from('profiles').upsert({id:id,name:(p.name||'').slice(0,60),grade:p.grade||null,role:p.role||'student',school:(p.school||'').slice(0,80),rating:S.rating==null?null:S.rating,contests:contests,updated_at:now})
  ]).then(function(rs){
    var err=rs[0].error||rs[1].error;if(err)throw err;
    SYNC_WARNED=false;
  }).catch(function(e){
    if(!SYNC_WARNED){SYNC_WARNED=true;toast(t('cl_sync_err'))}
    console.warn('sync',e);
  }).then(function(){SYNC_BUSY=false;if(SYNC_AGAIN){SYNC_AGAIN=false;pushCloud()}});
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&SYNC_T){clearTimeout(SYNC_T);SYNC_T=null;pushCloud()}});

/* load the student's data after sign-in */
function loadCloud(user){
  var id=user.id,local=lsGet(UPRE+id);
  return Promise.all([
    sb.from('user_state').select('data,updated_at').eq('id',id).maybeSingle(),
    sb.from('profiles').select('name,grade,role,school,rating').eq('id',id).maybeSingle()
  ]).then(function(rs){
    if(rs[0].error)throw rs[0].error;if(rs[1].error)throw rs[1].error;
    var st=rs[0].data,pr=rs[1].data||{},md=user.user_metadata||{};
    S=blankS();
    var data=st&&st.data&&Object.keys(st.data).length?st.data:null;
    if(!data&&local){data=local}                       // first sync from this device
    if(!data&&LEGACY_ACC(user.email)){data=LEGACY_ACC(user.email)}  // old local account with the same email
    if(data){for(var k in data)if(k!=='profile')S[k]=data[k]}
    if(local&&local.contests){S.contests=S.contests||{};for(var cid in local.contests){var lc=local.contests[cid];if(lc&&lc.photo&&S.contests[cid])S.contests[cid].photo=lc.photo}}
    S.profile=Object.assign({},PDEF,(local&&local.profile)||{},{
      name:pr.name||md.name||md.full_name||'',grade:pr.grade||md.grade||'',role:pr.role||md.role||'student',school:pr.school||'',email:user.email||''});
    if(['student','mentor','teacher'].indexOf(S.profile.role)<0)S.profile.role='student';
    if(S.rating==null&&pr.rating!=null)S.rating=pr.rating;
    S.subs=(S.subs||[]).filter(function(x){return byId(PROBLEMS,x.pid)});
    S.misFix=S.misFix||{};
    G.lastEmail=user.email;if(G.pendingEmail&&G.pendingEmail===user.email)G.pendingEmail='';lsSet(GKEY,G);lsSet(UPRE+id,S);
    if(!st||!data||!pr.name)pushCloud();
    admCheck();
  });
}
function LEGACY_ACC(email){
  var e=String(email||'').toLowerCase();
  if(G.users&&G.users[e]){var u=lsGet(UPRE+e);if(u)return u}
  if(LEGACY)return {subs:LEGACY.subs||[],hints:LEGACY.hints||{},chats:LEGACY.chats||{},ment:LEGACY.ment||{}};
  return null;
}

/* boot: wait for Supabase to restore the session (and handle e-mail links) */
function cleanAuthUrl(){
  var q=new URLSearchParams(location.search),h=location.hash,ch=false;
  ['code','error','error_code','error_description','type'].forEach(function(k){if(q.has(k)){q.delete(k);ch=true}});
  if(/access_token=|error_description=/.test(h)){h='';ch=true}
  if(ch)try{history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+h)}catch(e){}
}
function urlAuthError(){
  var q=new URLSearchParams(location.search+'&'+location.hash.replace(/^#/,''));
  return q.get('error_description')||q.get('error')||null;
}
function boot(){
  if(!sb){BOOTED=true;render();return}
  var err=urlAuthError();
  var hadCode=/[?&]code=/.test(location.search);
  sb.auth.onAuthStateChange(function(ev,session){
    var was=uid();SESSION=session;
    if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;if(BOOTED)nav('newpass');return}
    if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED')return;
    if(ev==='SIGNED_OUT'&&BOOTED&&was){S=blankS();IS_ADMIN=false;ADM.rows=null;render()}
  });
  sb.auth.getSession().then(function(r){
    SESSION=r.data&&r.data.session||null;
    cleanAuthUrl();
    if(err){AUTH_INFO={bad:true,text:/provider is not enabled|unsupported provider/i.test(err)?t('cl_g_off'):err.replace(/\+/g,' ')}}
    else if(hadCode&&!SESSION){AUTH_INFO={ok:true,text:t('cl_confirmed_login')}}
    if(SESSION&&!RECOVERY)return loadCloud(SESSION.user).then(function(){
      var prov=SESSION.user.app_metadata&&SESSION.user.app_metadata.provider;
      if(hadCode)AUTH_INFO={ok:true,text:prov&&prov!=='email'?t('t_hello',firstName()):t('cl_confirmed')}});
  }).catch(function(e){BOOT_ERR=String(e&&e.message||e)}).then(function(){
    BOOTED=true;
    if(RECOVERY){nav('newpass');return}
    if(loggedIn()&&(ROUTE===''||ROUTE==='login'||ROUTE==='register')&&AUTH_INFO&&AUTH_INFO.ok){nav(S.placement?'dashboard':'placement');toast(AUTH_INFO.text);AUTH_INFO=null;return}
    render();
  });
}

function errText(e){
  var m=String(e&&(e.message||e.error_description)||e||'');
  if(/already registered|already exists/i.test(m))return t('e_exists');
  if(/invalid login credentials/i.test(m))return t('e_login');
  if(/email not confirmed/i.test(m))return t('cl_not_confirmed');
  if(/not authorized/i.test(m))return t('cl_mail_blocked');
  if(/rate limit|too many|only request this/i.test(m))return t('cl_rate');
  if(/password/i.test(m)&&/(6|short|weak|characters)/i.test(m))return t('e_pass');
  if(/failed to fetch|network/i.test(m))return t('cl_net');
  return m||t('cl_net');
}

function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

var PLAN_PENDING=false,PLAN_AUTO=false,OPEN_MIS=null;

function pickProblem(tp){
  var L0=effLevel();
  var c=tp.p.map(function(id){return byId(PROBLEMS,id)}).filter(function(p){var b=best(p.id);return b===null||b<70});
  if(!c.length)return tp.p[0];
  c.sort(function(a,b){return Math.abs(a.lvl-L0)-Math.abs(b.lvl-L0)||a.lvl-b.lvl});
  return c[0].id;
}
function roadmapItems(){
  var items=[];
  activeMis().forEach(function(m){items.push({k:'now',h:t('rm_mis_h',mi(m).title),p:t('rm_mis_p'),mid:m.id})});
  ['weak','new','done'].forEach(function(want){
    TOPICS.forEach(function(tp,i){var st=topicState(tp);if(st.k!==want)return;var pid=want==='done'?tp.p[0]:pickProblem(tp),title=pr(byId(PROBLEMS,pid)).title,n=topicName(i);
      if(want==='weak')items.push({k:'now',h:t('rm_now_h',n),p:t('rm_now_p',st.s,title),pid:pid});
      else if(want==='new')items.push({k:'todo',h:t('rm_todo_h',n),p:t('rm_todo_p',title),pid:pid});

  };

function planPrompt(){
  return 'Ты — AI-ментор платформы SolveTrack по олимпиадной физике. По данным ученика составь персональную дорожную карту на ближайшее время и оцени его текущий уровень.\n'+
  'Уровни: 1 — начальный, 2 — средний, 3 — продвинутый. Статусы заблуждений: "mis" — ответил неверно и был уверен (настоящее заблуждение), "gap" — неверно наугад (пробел), "weak" — верно наугад.\n'+
  'Правила:\n'+
  '1. Сначала неисправленные заблуждения (status "mis", fixed=false), затем пробелы ("gap", fixed=false), затем задачи.\n'+
  '2. Задачи подбирай под уровень: начальному — сложность 1–2, среднему — 2, потом 3, продвинутому — 2–3. Не давай задачу сложности 3, пока ученик не решил на 70+ хотя бы одну задачу сложности 2.\n'+
  '3. Не включай задачи с best_score ≥ 70. Если по задаче много попыток с низкими баллами или много вопросов к ИИ, сначала поставь связанное заблуждение или более лёгкую задачу той же темы.\n'+
  '4. Уровень меняй осторожно: повышай, если ученик решил на 70+ не меньше двух задач со сложностью не ниже его уровня; понижай, если у него 2+ попытки ниже 40 на задачах сложности 1; иначе оставь current_level.\n'+
  '5. Если в entry_test_problems по теме стоит "dont_know" или в заблуждениях темы answered_dont_know=true, ученик эту тему ещё не проходил: начни её с самой лёгкой задачи и прямо скажи, что начинаем с основ. Учитывай класс (student_grade) и цель (student_goal), если они указаны.\n'+
  '6. Используй только id из данных. От 3 до 6 шагов.\n'+
  '7. Поля why, summary и level_reason пиши на языке «'+langName()+'», по одному короткому предложению, обращайся к ученику на «ты». Формулы в этих полях пиши в LaTeX внутри $...$.\n'+
  'Верни ТОЛЬКО JSON без пояснений, в формате: {"level":2,"level_reason":"...","summary":"...","steps":[{"type":"misconception","id":"m1","why":"..."},{"type":"problem","id":3,"why":"..."}]}';
}
function parseJSON(s){try{return JSON.parse(s)}catch(e){var m=String(s).match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e2){}}return null}}
function validatePlan(j){
  if(!j||!Array.isArray(j.steps))return null;
  var seen={};
  var steps=j.steps.map(function(s){
    if(!s)return null;var why=String(s.why||'');
    if(/^mis/.test(s.type||'')&&mById(String(s.id))){var k='m'+s.id;if(seen[k])return null;seen[k]=1;return {type:'mis',id:String(s.id),why:why}}
    if(/^prob/.test(s.type||'')&&byId(PROBLEMS,+s.id)){var k2='p'+s.id;if(seen[k2])return null;seen[k2]=1;return {type:'prob',id:+s.id,why:why}}
    return null}).filter(Boolean).slice(0,6);
  if(!steps.length)return null;
  var lv=+j.level;if([1,2,3].indexOf(lv)<0)lv=effLevel();
  return {level:lv,reason:String(j.level_reason||''),summary:String(j.summary||''),steps:steps,ts:Date.now(),lang:LANG};
}
function aiPlan(){
  if(PLAN_PENDING||!S.diag)return;

  .then(function(txt){var p=validatePlan(parseJSON(txt));if(!p)throw new Error(t('e_plan'));S.plan=p;S.level=p.level;S.planStale=false})
  .catch(function(e){S.planErr=e&&e.message||String(e)})
  .then(function(){PLAN_PENDING=false;save();planViewsRefresh()});
}

function heat(){
  var cnt={};S.subs.forEach(function(s){var k=dayKey(s.ts);cnt[k]=(cnt[k]||0)+1});
  var now=new Date();now.setHours(0,0,0,0);
  var dow=(now.getDay()+6)%7; // Mon=0
  var start=new Date(now);start.setDate(start.getDate()-dow-25*7);
  var out='';
  for(var i=0;i<26*7;i++){
    var dt=new Date(start);dt.setDate(start.getDate()+i);
    if(dt>now){out+='<i style="visibility:hidden"></i>';continue}
    var c=cnt[dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate()]||0;
    var l=c===0?'':c===1?'l1':c<=2?'l2':c<=4?'l3':'l4';
    out+='<i class="'+l+'" title="'+fmtDay(dt)+': '+c+'"></i>';
  }
  return '<div class="heat">'+out+'</div>';
}

function gradeSolution(p,text){
  var low=text.toLowerCase();
  // слова длиной от 3 букв, в которых есть гласная (ru / kk / en): отсекает «ррррр», «фывфыв» и т.п.
  var words=(low.match(/[a-zа-яёәғқңөұүһі]{3,}/g)||[]).filter(function(w){return /[аәеёиоөуұүыіэюяaeiouy]/.test(w)&&!/(.{1,3})\1{2,}/.test(w)});
  var uniq={};words.forEach(function(w){uniq[w]=1});
  if(Object.keys(uniq).length<5)return 0; // меньше 5 разных осмысленных слов — это не решение
  var hit=0;
  p.keys.forEach(function(k){try{if(new RegExp(k,'i').test(low))hit++}catch(e){}});
  return Math.round(100*hit/p.keys.length); // баллы только за найденные ключевые идеи
}

function nq(id){for(var i=0;i<NUMQ.length;i++)if(NUMQ[i].id===id)return NUMQ[i]}
function nqText(q){return q[LANG]||q.ru}
function nqSol(q){return '$'+(LANG==='en'?q.s.replace(/\{,\}/g,'.'):q.s)+'$ '+esc(unitTr(q.u))}
function fmtNum(x){var s=String(x);return LANG==='en'?s:s.replace('.',',')}
function parseNum(s){s=String(s||'').replace(/\s/g,'').replace(',','.').replace(/[^0-9.eE+\-]/g,'');if(!s||isNaN(+s))return null;return +s}
function numOk(q,v){return v!=null&&Math.abs(v-q.a)<=Math.max(1e-9,Math.abs(q.a)*(q.tol||0.02))}

/* ---------- rating & divisions ---------- */
function divOf(r){return r>=1500?1:(r>=1100?2:3)}
function titleIdx(r){return r>=1900?4:(r>=1600?3:(r>=1300?2:(r>=1000?1:0)))}
var TCOL=['#808080','#16a34a','#2563eb','#9333ea','#ea580c'];
function rBadge(r){return '<b style="color:'+TCOL[titleIdx(r)]+'">'+r+'</b>'}
function setRating(r,why){r=Math.max(400,Math.round(r));S.rating=r;S.ratingHist=S.ratingHist||[];S.ratingHist.push({ts:Date.now(),r:r,why:why})}
function ratingLevel(){return S.rating==null?null:(S.rating>=1500?3:(S.rating>=1100?2:1))}

/* ---------- placement exam (adaptive staircase) ---------- */
var PX=null,PX_N=6,PX_SEC=180;
function pxStartLevel(){var g=+S.profile.grade;return g===7?2:(g===8?3:(g===9?4:(g>=10?5:3)))}
function pxPick(lv){
  var used={};PX.log.forEach(function(x){used[x.id]=1});if(PX.cur)used[PX.cur]=1;
  for(var d=0;d<7;d++){var cand=[lv-d,lv+d];for(var k=0;k<2;k++){var l=cand[k];if(l<1||l>7)continue;
    var pool=NUMQ.filter(function(q){return q.lv===l&&!used[q.id]});if(pool.length)return pool[Math.floor(Math.random()*pool.length)]}}
  return null;
}
function pxNext(){var q=pxPick(PX.lv);PX.cur=q.id;PX.lv=q.lv;PX.t0=Date.now();PX.msg=PX.msg||''}
function pxAnswer(val,timeout){
  var q=nq(PX.cur),ok=!timeout&&numOk(q,val);
  PX.log.push({id:q.id,lv:q.lv,ok:ok,v:timeout?null:val,sec:Math.round((Date.now()-PX.t0)/1000)});
  PX.msg=ok?'px_ok':(timeout?'px_time':'px_no');PX.msgOk=ok;
  if(PX.log.length>=PX_N){pxFinish();return}
  PX.lv=Math.max(1,Math.min(7,q.lv+(ok?1:-1)));PX.cur=null;pxNext();render();
  var i=document.getElementById('pxa');if(i)i.focus();
}
function pxFinish(){
  var est=PX.log.reduce(function(a,x){return a+x.lv+(x.ok?0.5:-0.5)},0)/PX.log.length;
  var r=Math.round((600+200*est)/10)*10;
  S.placement={done:true,ts:Date.now(),log:PX.log,rating:r,grade:S.profile.grade};
  S.ratingHist=[];setRating(r,'start');S.contests=S.contests||{};
  PX=null;markStale();save();render();
}
function placement(){
  var head='<div class="ph"><div><h1>'+t('px_h')+'</h1></div></div>';
  if(!PX&&S.placement)return pxResults();
  if(!PX){
    return '<div class="content dx-wrap">'+head+'<div class="card dx-card"><p class="dx-text">'+t('px_intro',esc(S.profile.grade||'—'))+'</p>'+
    '<ul class="dx-rules"><li>'+t('px_r1',PX_N,PX_SEC/60)+'</li><li>'+t('px_r2')+'</li><li>'+t('px_r3')+'</li></ul>'+
    '<div class="dx-nav"><span></span><button class="btn green" data-act="x-px-start">'+t('px_start')+' '+ic('arrow')+'</button></div></div></div>';
  }
  var q=nq(PX.cur),n=PX.log.length+1,segs='';
  for(var i=0;i<PX_N;i++)segs+='<i class="'+(i<PX.log.length?(PX.log[i].ok?'ok':'no'):(i===PX.log.length?'cur':''))+'"></i>';
  return '<div class="content dx-wrap">'+head+'<div class="card dx-card">'+
  '<div class="px-top"><span class="pill p-blue">'+topicName(q.tp)+'</span><span class="px-lv">'+t('px_lvl',q.lv)+'</span><span class="px-timer" id="pxt" aria-live="off">'+ic('clock')+'<b>'+pxClock()+'</b></span></div>'+
  '<div class="px-segs">'+segs+'</div>'+
  (PX.msg?'<div class="px-msg '+(PX.msgOk?'ok':'no')+'" role="status">'+t(PX.msg)+'</div>':'')+
  '<div class="dx-label">'+t('px_q',n,PX_N)+'</div><p class="dx-text">'+nqText(q)+'</p>'+
  '<form id="pxform" class="px-form" autocomplete="off"><label class="px-in"><span>'+t('px_ans')+'</span><div><input id="pxa" inputmode="decimal" placeholder="0"><em>'+esc(unitTr(q.u))+'</em></div></label>'+
  '<div class="dx-nav"><button type="button" class="btn" data-act="x-px-skip">'+t('px_skip')+'</button><button class="btn blue" type="submit">'+t('px_send')+' '+ic('arrow')+'</button></div></form></div></div>';
}
function pxLeft(){return Math.max(0,PX_SEC-Math.floor((Date.now()-PX.t0)/1000))}
function clock(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
function pxClock(){return clock(pxLeft())}
function pxResults(){
  var p=S.placement,r=p.rating,byT={};
  p.log.forEach(function(x){var q=nq(x.id);if(!q)return;var o=byT[q.tp]=byT[q.tp]||{n:0,ok:0};o.n++;if(x.ok)o.ok++});
  var topics=Object.keys(byT).map(function(k){var o=byT[k];return '<div class="row"><span>'+topicName(+k)+'</span><span class="pill '+(o.ok===o.n?'p-easy':o.ok?'p-mid':'p-hard')+'">'+o.ok+' / '+o.n+'</span></div>'}).join('');
  var log=p.log.map(function(x,i){var q=nq(x.id);if(!q)return '';
    return '<div class="res-item"><div class="hd2"><span class="pill '+(x.ok?'p-easy':'p-hard')+'">'+(x.ok?'✓':'✗')+'</span><span class="pill p-gray">'+t('px_lvl',x.lv)+'</span><span style="flex:1;min-width:0;font-weight:500">'+nqText(q)+'</span></div>'+
    '<p>'+t('px_yours',x.v==null?t('px_noans'):fmtNum(x.v))+' · '+t('px_right',fmtNum(q.a)+' '+esc(unitTr(q.u)))+' · '+clock(x.sec||0)+'</p>'+(x.ok?'':'<p class="expl">'+nqSol(q)+'</p>')+'</div>'}).join('');
  return content('<div class="ph"><div><h1>'+t('px_res_h')+'</h1><p>'+t('px_res_p')+'</p></div><div class="fa"><button class="btn" data-act="x-px-again">'+t('px_again')+'</button><a class="btn green" href="#dashboard">'+t('px_to_dash')+' '+ic('arrow')+'</a></div></div>'+
  '<div class="stats">'+stat(t('rt_h'),r,t('tt'+titleIdx(r))).replace('card stat','card stat hero')+stat(t('rt_div'),'Div. '+divOf(r),t('ct_h'))+stat(t('st_solved'),p.log.filter(function(x){return x.ok}).length+' / '+p.log.length,t('px_h'))+stat(t('f_grade'),esc(p.grade||'—'),'')+'</div>'+
  '<div class="g2 rm"><div class="card"><h3>'+ic('bars')+t('px_log_h')+'</h3>'+log+'</div><div class="stack"><div class="card"><h3>'+ic('target')+t('px_topics_h')+'</h3><div class="list">'+topics+'</div></div>'+
  (S.diag?'':'<div class="card"><h3>'+ic('spark')+t('dx_banner_h')+'</h3><div class="sub">'+t('dx_banner_p')+'</div><a class="btn" style="margin-top:12px" href="#diagnostic">'+t('dx_go')+'</a></div>')+'</div></div>');
}

function cClose(c){var p=c.date.split('-');return new Date(+p[0],+p[1]-1,+p[2]+1,22,0,0).getTime()}
function cState(c){var n=Date.now();return n<cOpen(c)?'soon':(n<=cClose(c)?'open':'past')}

function cCredit(q,st,pid){
  if(numOk(q,st.ans[pid]))return 1;
  var a=(st.ai||{})[pid];if(!a||a.fail)return 0;
  if(a.final!=null&&numOk(q,a.final)&&a.score>=0.75)return 1;   // верный ответ записан на листе

function cScore(c){
  var st=cMine(c),ids=cSet(c,st),solved=0,pts=0,sum=0;
  if(st.from==null)st.from=S.rating;var R=st.from;
  ids.forEach(function(id){var q=nq(id),cr=cCredit(q,st,id);if(cr===1)solved++;pts+=cr;sum+=cr-1/(1+Math.pow(10,(q.rt-R)/400))});
  st.solved=solved;st.pts=pts;
  if(st.rated){var nr=Math.max(400,Math.round(R+40*sum)),h=S.ratingHist=S.ratingHist||[],last=h[h.length-1];
    if(last&&last.why==='c'+c.id){last.r=nr;S.rating=nr;st.to=nr}
    else if(st.to==null){st.to=nr;setRating(nr,'c'+c.id)}
    markStale()}
  save();
}

  'Шкала score:\n1 — верный метод и верный итоговый ответ;\n0.75 — верный метод, решение доведено до конца, ошибка только в арифметике, округлении или работе с калькулятором;\n0.5 — верные законы и существенное продвижение, но решение не закончено или есть ошибка в преобразованиях либо единицах;\n0.25 — записан подходящий закон, но продвижения почти нет;\n0 — неверный подход, решение другой задачи, пустой лист или почерк нельзя прочитать.\n'+

function cGrade(c){
  var st=cMine(c);if(!st||GRADING[c.id])return;var ids=cPending(st,cSet(c,st));if(!ids.length)return;
  GRADING[c.id]=true;st.ai=st.ai||{};var i=0;

    var pid=ids[i++],q=nq(pid);

      {type:'text',text:'Задача: '+q.ru+'\nВерный ответ: '+q.a+' '+q.u+'\nЭталонное решение: '+q.s+'\nЧисло, которое ученик ввёл на сайте: '+(st.ans[pid]==null?'не ввёл':st.ans[pid])},
      {type:'image_url',image_url:{url:st.photo[pid]}}]}],{json:true,noFormat:true,max:500,models:GROQ.vision,timeout:60000})

    .catch(function(e){st.ai[pid]={fail:true,err:e&&e.message||String(e)}})
    .then(function(){save();if(ROUTE==='contest-'+c.id)render(true);next()});
  }

}

  else if(a==='x-c-finish'){if(b.getAttribute('data-c')!=='1'){b.setAttribute('data-c','1');b.textContent=t('ct_finish_c');return}cFinish(byId(CONTESTS,id));render()}
  else if(a==='x-c-unphoto'){var m0=/^contest-(\d+)$/.exec(ROUTE),c0=m0&&byId(CONTESTS,+m0[1]),s0=c0&&cMine(c0);if(s0&&!s0.done&&s0.photo){delete s0.photo[b.getAttribute('data-pid')];save();render(true)}}
  else if(a==='x-c-recheck'){var c1=byId(CONTESTS,id),s1=c1&&cMine(c1);if(s1){cPending(s1,cSet(c1,s1)).forEach(function(p){delete s1.ai[p]});cGrade(c1);render(true)}}
  else if(a==='x-notify'){Notification.requestPermission().then(function(p){if(p==='granted'){G.notify=true;save();toast(t('ev_notify_on'));remind()}else toast(t('ev_notify_no'));render(true)})}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='pxform')return;e.preventDefault();
  var v=parseNum(document.getElementById('pxa').value);if(v==null){toast(t('px_num'));return}
  pxAnswer(v,false);
});
document.addEventListener('change',function(e){
  var el=e.target;if(!el.classList)return;
  var m=/^contest-(\d+)$/.exec(ROUTE);if(!m)return;var c=byId(CONTESTS,+m[1]),st=c&&cMine(c);if(!st||st.done)return;
  if(el.classList.contains('c-photo')){
    var f=el.files&&el.files[0],pid=el.getAttribute('data-pid');if(!f)return;
    if(!/^image\//.test(f.type)){toast(t('sc_bad'));return}
    var fr=new FileReader();fr.onload=function(){shrink(fr.result,1280,0.72,function(u){if(!u){toast(t('sc_bad'));return}
      document.querySelectorAll('.c-in').forEach(function(x){var v=parseNum(x.value);if(v!=null)st.ans[x.getAttribute('data-pid')]=v});
      st.photo=st.photo||{};st.photo[pid]=u;save();toast(t('sc_added'));render(true)})};fr.readAsDataURL(f);return}
  if(!el.classList.contains('c-in'))return;
  var v=parseNum(el.value);if(v==null)delete st.ans[el.getAttribute('data-pid')];else st.ans[el.getAttribute('data-pid')]=v;save();if(v!=null)toast(t('ct_saved'));
});
setInterval(function(){
  if(ROUTE==='placement'&&PX&&PX.cur){
    var el=document.querySelector('#pxt b');if(el){el.textContent=pxClock();el.parentNode.classList.toggle('low',pxLeft()<=30)}
    if(pxLeft()<=0)pxAnswer(null,true);
  }
  var m=/^contest-(\d+)$/.exec(ROUTE);
  if(m){var c=byId(CONTESTS,+m[1]),st=c&&cMine(c);if(st&&!st.done){var e2=document.querySelector('#ctt b');if(e2){e2.textContent=clock(cLeft(st));e2.parentNode.classList.toggle('low',cLeft(st)<=300)}
    if(cLeft(st)<=0){document.querySelectorAll('.c-in').forEach(function(x){var v=parseNum(x.value);if(v!=null)st.ans[x.getAttribute('data-pid')]=v});cFinish(c);render()}}}
},1000);
setInterval(remind,60000);setTimeout(remind,3000);

function typeset(el){
  if(!el||!window.renderMathInElement)return;
  try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false,ignoredTags:['script','noscript','style','textarea','pre','code','option','input','select']})}catch(e){}
}
window.__katexReady=function(){typeset(root)};
function render(keepScroll){renderView(keepScroll);typeset(root);if(ROUTE==='roadmap')rmDraw()}
function renderView(keepScroll){
  var h=ROUTE;var out;
  var y=window.scrollY;
  if(h===''||h==='home'){root.innerHTML=landing();window.scrollTo(0,keepScroll?y:0);return}
  if(!BOOTED){root.innerHTML='<div class="boot"><span class="mark">'+ic('book')+'</span><span class="dots"><i></i><i></i><i></i></span></div>';return}
  if(h==='newpass'&&RECOVERY){root.innerHTML=authPage('newpass');return}
  if(h==='register'||h==='login'||h==='checkmail'||h==='forgot'){
    if(loggedIn()){nav('dashboard');return}
    root.innerHTML=authPage(h);window.scrollTo(0,keepScroll?y:0);if(h==='checkmail')resendTick();
    if(!keepScroll){var f=document.querySelector('.auth-form input');if(f)f.focus()}
    return}
  if(!loggedIn()){nav(G.lastEmail?'login':'register');return}
  if(needsOnboard()){if(h!=='onboard'){nav('onboard');return}root.innerHTML=onboardPage();return}
  if(h==='onboard'){nav(S.placement?'dashboard':'placement');return}
  var m=/^problem-(\d+)$/.exec(h);
  if(m){root.innerHTML=shell('problems',problemPage(+m[1]));var c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;if(keepScroll)window.scrollTo(0,y);return}
  var am=/^admin-([0-9a-f-]{36})$/.exec(h);
  if(am){root.innerHTML=shell('admin',adminStudent(am[1]));window.scrollTo(0,keepScroll?y:0);return}
  var cm=/^contest-(\d+)$/.exec(h);
  if(cm){root.innerHTML=shell('contests',contestPage(+cm[1]));window.scrollTo(0,keepScroll?y:0);return}
  var q=Q.q;
  switch(h){
    case 'dashboard':out=dashboard();break;
    case 'mentors':out=mentors();break;
    case 'profile':out=profile();break;
    case 'admin':out=adminPage();break;
    case 'roadmap':out=roadmap();break;
    case 'diagnostic':out=diagnostic();break;
    case 'placement':out=placement();break;
    case 'contests':out=contestsPage();break;
    case 'books':out=books(q);break;
    case 'courses':out=courses(q);break;
    case 'olympiads':out=olympiads();break;
    case 'problems':out=problems();break;
    case 'search':out=searchPage(q);break;
    default:nav('dashboard');return;
  }
  root.innerHTML=shell(h==='search'?'':h,out,h==='search'?q:'');
  window.scrollTo(0,keepScroll?y:0);
  if((h==='roadmap'||h==='dashboard')&&S.diag&&S.planStale&&!PLAN_PENDING&&!PLAN_AUTO)setTimeout(aiPlan,0);
}
function searchPage(q){
  q=(q||'').toLowerCase();
  var r=[];
  PROBLEMS.forEach(function(p){var x=pr(p);if((x.title+topicName(p.tp)+x.text).toLowerCase().indexOf(q)>-1)r.push([t('k_prob'),x.title,'problem-'+p.id])});
  COURSES.forEach(function(c){if((c.t+c.by).toLowerCase().indexOf(q)>-1)r.push([t('k_course'),c.t,'courses'])});
  BOOKS.forEach(function(b0){var b=bk(b0);if((b.t+b.a+b.d).toLowerCase().indexOf(q)>-1)r.push([t('k_book'),b.t,'books'])});
  OLYMP.forEach(function(o){if((o.t+o.d).toLowerCase().indexOf(q)>-1)r.push([t('k_olymp'),o.t,'olympiads'])});
  return content('<div class="ph"><div><h1>'+t('search')+'</h1><p>'+t('sr_p',esc(q),r.length)+'</p></div></div><div class="card"><div class="list">'+
   (r.length?r.map(function(x){return '<a class="row" href="#'+x[2]+'"><span>'+esc(x[1])+'</span><span class="pill p-blue">'+x[0]+'</span></a>'}).join(''):'<div class="empty">'+t('sr_none')+'</div>')+'</div></div>');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var an=e.target.closest('a[href^="#"]');if(an){e.preventDefault();nav(an.getAttribute('href').slice(1));return}
  var go=e.target.closest('[data-go]');if(go&&!e.target.closest('a,button')){nav(go.getAttribute('data-go'));return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),id=+b.getAttribute('data-id');
  if(a==='lang'){var l=b.getAttribute('data-l');if(L[l]&&l!==LANG){LANG=l;G.lang=l;if(S.plan&&S.plan.lang!==LANG)markStale();save();applyLang();render(true)}}
  else if(a==='theme'){G.theme=isDark()?'light':'dark';applyTheme();save();render(true)}
  else if(a==='reset'){
    if(b.getAttribute('data-c')!=='1'){b.setAttribute('data-c','1');b.textContent=t('reset_c');return}
    S.subs=[];S.hints={};S.chats={};S.ment={};markStale();save();toast(t('t_reset'));render()}
  else if(a==='demo'){
    var nw=Date.now(),DY=86400000,pl=[[1,90],[2,85],[7,80],[3,55],[4,40]];
    [0,1,2,4,5,9,10,11,15,16,20,23,30,31].forEach(function(d,i){var x=pl[i%pl.length];S.subs.push({pid:x[0],text:'Demo',score:x[1],ts:nw-d*DY-i*3600000})});
    markStale();save();toast(t('t_demo'));render()}
  else if(a==='toast'){toast(t(b.getAttribute('data-m')))}
  else if(a==='logout'){doLogout()}
  else if(a==='dx-start'){DX.i=0;DX.anim=true;render();DX.anim=false}
  else if(a==='dx-cancel'){DX=null;render()}
  else if(a==='dx-retake'){DX={i:-1,ans:{}};if(ROUTE==='diagnostic')render();else nav('diagnostic')}
  else if(a==='dx-a'||a==='dx-c'){var qid=QSEQ[DX.i],cur=DX.ans[qid]=DX.ans[qid]||{},raw=b.getAttribute('data-v');
    if(a==='dx-c')cur.c=+raw;else if(mById(qid)){if(raw==='idk'){cur.v='idk';delete cur.c}else{var nv=raw==='1';if(cur.v!==nv)delete cur.c;cur.v=nv}}else cur.v=+raw;
    render(true);
    if(dxComplete(qid)){var tok=DX.tok=(DX.tok||0)+1,at=DX.i;setTimeout(function(){if(DX&&DX.tok===tok&&DX.i===at&&ROUTE==='diagnostic')dxGo(1)},420)}}
  else if(a==='dx-back'){DX.tok=(DX.tok||0)+1;if(DX.i>0)dxGo(-1)}
  else if(a==='dx-next'){if(b.disabled)return;DX.tok=(DX.tok||0)+1;dxGo(1)}
  else if(a==='aiplan'){PLAN_AUTO=false;aiPlan()}
  else if(a==='gomis'){var mid=b.getAttribute('data-m');if(ROUTE!=='roadmap'){nav('roadmap');setTimeout(function(){msOpen(mid)},150)}else msOpen(mid)}
  else if(a==='fix'){var fm=mById(b.getAttribute('data-m'));OPEN_MIS=fm.id;
    if((b.getAttribute('data-v')==='1')===fm.ok){S.misFix[fm.id]=true;markStale();save();toast(t('t_fixed'));render(true)}
    else{toast(t('t_notyet'));var ex=document.querySelector('#mis-'+fm.id+' details.expl');if(ex)ex.open=true}}
  else if(a==='mentor'){if(S.ment[id])delete S.ment[id];else S.ment[id]=true;save();render(true)}
  else if(a==='hint'){if(PENDING[id])return;var c=S.chats[id]=S.chats[id]||[];c.push({r:'me',t:t('me_hint'),api:t('hint_req')});askAI(id)}
  else if(a==='clearchat'){if(PENDING[id])return;S.chats[id]=[];save();render(true)}
  else if(a==='submit'){
    var ta=document.getElementById('sol');var tx=ta.value.trim();var p2=byId(PROBLEMS,id);
    if(tx.length<40){toast(t('t_short'));ta.focus();return}
    var sc=gradeSolution(p2,tx);S.subs.push({pid:id,text:tx,score:sc,ts:Date.now()});markStale();
    var c2=S.chats[id]=S.chats[id]||[];
    c2.push({r:'ai',t:sc===0?t('g_zero'):sc>=70?t('g_ok',sc):t('g_part',sc)});
    save();var tries=S.subs.filter(function(s){return s.pid===id}).reverse();
    document.getElementById('tries').innerHTML=triesHtml(tries);typeset(document.getElementById('tries'));ta.value='';refreshChat(id);
    document.querySelectorAll('.plist a').forEach(function(x){if(x.getAttribute('href')==='#problem-'+id){var st=x.querySelector('.st');st.className='st '+status(id)}});
    toast(t('t_sent',sc));
  }
});
function refreshChat(id){
  var c=document.getElementById('chat');if(!c||+c.getAttribute('data-pid')!==id)return;
  c.innerHTML=chatHtml(id);typeset(c);c.scrollTop=c.scrollHeight;
  var busy=!!PENDING[id];
  ['aq','aqs','ahint'].forEach(function(x){var el=document.getElementById(x);if(el)el.disabled=busy});
  var cl=document.getElementById('aclear');if(cl)cl.hidden=busy||!(S.chats[id]||[]).length;
}
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='rform'){e.preventDefault();doRegister();return}
  if(f.id==='lform'){e.preventDefault();doLogin();return}
  if(f.id==='sform'){e.preventDefault();var v=document.getElementById('q').value.trim();if(!v)return;Q.q=v;nav('search')}
  else if(f.id==='pform'){e.preventDefault();var g=function(i){return document.getElementById(i).value.trim()};
    var nm=g('p_name');if(!nm){toast(t('t_name'));return}
    S.profile={name:nm,role:g('p_role'),email:S.profile.email,school:g('p_school'),grade:g('p_grade'),goal:g('p_goal'),bio:g('p_bio')};save();render();toast(t('t_saved'))}
  else if(f.id==='aform'){e.preventDefault();var id=+f.getAttribute('data-id');var inp=document.getElementById('aq');var v2=inp.value.trim();if(!v2)return;
    if(PENDING[id])return;var c=S.chats[id]=S.chats[id]||[];c.push({r:'me',t:v2});inp.value='';askAI(id)}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='cq'||el.id==='clv'){
    var q=document.getElementById('cq').value.toLowerCase(),lv=document.getElementById('clv').value;
    var l=COURSES.filter(function(c){return (!q||(c.t+c.by).toLowerCase().indexOf(q)>-1)&&(!lv||c.lv===lv)});
    document.getElementById('cgrid').innerHTML=l.length?l.map(courseCard).join(''):'<div class="empty">'+t('nothing')+'</div>';
  }
  if(el.id==='ft'||el.id==='fl'){document.getElementById('ptb').innerHTML=probRows(document.getElementById('ft').value,document.getElementById('fl').value)}
});
document.addEventListener('keydown',function(e){
  if(ROUTE!=='diagnostic'||!DX||DX.calc||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  var b=null;
  if(DX.i<0){if(e.key==='Enter')b=document.querySelector('[data-act=dx-start]')}
  else if(/^[1-5]$/.test(e.key))b=document.querySelector('[data-key="'+e.key+'"]');
  else if(e.key==='Enter')b=document.querySelector('[data-act=dx-next]:not([disabled])');
  else if(e.key==='ArrowLeft'||e.key==='Backspace')b=document.querySelector('[data-act=dx-back]');
  if(b){e.preventDefault();b.click()}
});
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace(/^#/,'');if(h!==ROUTE){ROUTE=h;if(h!=='search')Q.q='';render()}});
boot();
})();
